<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Level Editor Lab</title>
<style>
  body { margin: 0; display: flex; flex-direction: column; font: 13px system-ui, sans-serif; background: #15171a; color: #ddd; height: 100vh; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 12px; background: #1d2024; }
  #bar label, #pop label { display: flex; align-items: center; gap: 6px; }
  #bar input[type=range] { width: 110px; }
  input[type=number] { width: 70px; }
  .val { color: #9ab; min-width: 34px; font-family: ui-monospace, monospace; }
  #coverBar, #biomeBar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  #coverBar[hidden], #biomeBar[hidden] { display: none; }
  #views { flex: 1; display: flex; min-height: 0; }
  #views > div { flex: 1; position: relative; min-width: 0; border-left: 1px solid #333; overflow: hidden; }
  #views canvas { display: block; width: 100%; height: 100%; }
  #map { cursor: crosshair; }
  #pop { position: absolute; display: none; flex-direction: column; gap: 5px; padding: 8px 10px; background: #1d2024ee; border: 1px solid #fc6; border-radius: 4px; }
  #pop label { justify-content: space-between; }
  #pop b { color: #fc6; }
  #legend { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 3px; padding: 6px 10px; background: #1d2024dd; border-radius: 4px; }
  #legend label { display: flex; align-items: center; gap: 6px; }
  #legend i { width: 10px; height: 10px; border-radius: 2px; }
</style>
</head>
<body>
<div id="bar">
  <label>New tree <select id="kind"></select></label>
  <label>Seed <input id="seed" type="number"></label>
  <label>Relief <input id="relief" type="range" min="0" max="60" step="1"><span class="val" id="v_relief"></span></label>
  <button id="save">Save .json</button>
  <button id="loadBtn">Load .json</button><input id="loadFile" type="file" accept=".json" hidden>
  <button id="random">🎲 Random</button>
  <button id="reset">Reset</button>
  <button id="undo" title="Ctrl/⌘ Z">Undo</button><button id="redo" title="Ctrl/⌘ Shift Z, Ctrl Y">Redo</button>
  <label>Tool <select id="tool"><option value="edit">Trees &amp; road</option><option value="cover">Ground cover</option><option value="spec">Spectators (P)</option><option value="biome">Biome</option></select></label>
  <span id="biomeBar" hidden>
    <label>Biome <select id="biomeType"></select></label>
    <label>Brush <input id="biomeBrush" type="range" min="10" max="500" step="10" value="100"><span class="val" id="v_biomeBrush"></span></label>
    <label>Snow above <input id="biomeThreshold" type="number" value="90" style="width:4em"> m</label>
    <button id="biomeFill">Fill from height</button>
  </span>
  <span id="coverBar" hidden>
    <label>Cover <select id="coverType"></select></label>
    <label>Brush <input id="brush" type="range" min="1" max="40" step="1" value="6"><span class="val" id="v_brush"></span></label>
    <label>Mode <select id="coverMode"><option value="paint">Paint</option><option value="erase">Erase</option></select></label>
    <button id="coverImport">Import cover mask</button><input id="coverFile" type="file" accept=".png,image/png" hidden>
    <button id="coverClear">Clear cover</button>
  </span>
  <span class="val" id="sight"></span>
</div>
<div id="views">
  <div id="wrap2d"><canvas id="map"></canvas><div id="pop"></div><div id="legend"></div></div>
  <div id="wrap3d"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="groundcover_tufts.js"></script>
<script src="buildings.js"></script>
<script src="spectators.js"></script>
<script>
// A hand-editable patch of world: a 2D top-down editor (left) and the same patch rendered in 3D the way the game draws it (right).
const $ = id => document.getElementById(id);

const T = { x0: -300, z0: -300, full: true };
const big = () => SIZE > WIN_M, WW = () => G * GCELL;
function setSize(l) {
  SIZE = l.size ?? 600;
  N = l.heightmap?.length ? Math.round(Math.sqrt(l.heightmap.length)) - 1 : Math.round(SIZE / 3);
  CELL = SIZE / N; T.full = SIZE <= WIN_M;
  G = Math.round((T.full ? SIZE : WIN_M) / 1.5); GCELL = T.full ? SIZE / G : 1.5;
  T.x0 = T.z0 = -SIZE / 2;

  coverOverlay.width = coverOverlay.height = SIZE;

}
// Height follows region_library.gd's tree_mix sizes; width is height x the atlas frame's aspect.
// `low` is how far the leaves spread from the trunk in the lowest 3 m (tools/tree_low_reach.py), so clearing the road keeps them off it.
const KINDS = {
  "tree.png": { low: 1.2, h: 9.375, col: "#4f7a2c" },
  "tree-greece.webp": { low: 1.7, h: 4.0, col: "#7a8a3a" },
  "tree-taiga.webp": { low: 2.3, h: 22.5, col: "#2f4a2a" },
  "tree-snow.webp": { low: 4.0, h: 12.9, col: "#cfd8dc" },
  "tree-snow-laden.webp": { low: 4.3, h: 12.4, col: "#e6ecef" },
  // Welsh forest species, exported from the tree lab's presets as star atlases; tint = level_view.gd's KIND_TINT
  "levels/trees/sitka_spruce.png": { low: 5.4, h: 22, col: "#1e3322", tint: [0.3, 0.38, 0.32] },
  "levels/trees/young_spruce.png": { low: 3.0, h: 10, col: "#25402a", tint: [0.34, 0.42, 0.34] },
  "levels/trees/birch.png": { low: 0.7, h: 9, col: "#9fcf4c", tint: [0.82, 0.86, 0.72] },
  "levels/trees/rowan.png": { low: 1.4, h: 5, col: "#7cbb35", tint: [0.82, 0.86, 0.72] },
  "levels/trees/alder.png": { low: 1.3, h: 9, col: "#5f9a2e", tint: [0.8, 0.86, 0.72] },
  "levels/trees/scrub.png": { low: 0.7, h: 1.4, col: "#6faa3a", tint: [0.8, 0.85, 0.72] },
  // snow-biome species, from the tree lab's snow presets
  "levels/trees/snow_laden_spruce.png": { low: 4.0, h: 18, col: "#dfe6ea" },
  "levels/trees/snowy_young_spruce.png": { low: 2.3, h: 7, col: "#cfd8dc" },
  "levels/trees/dusted_spruce.png": { low: 4.5, h: 20, col: "#9aa8a4" },
  "levels/trees/snow_bowed_birch.png": { low: 1.9, h: 6, col: "#eef2f4" },

// Game textures are named bare; the lab's own atlases are paths relative to this page.
const texUrl = kind => kind.includes("/") ? kind : "../textures/" + kind;
const aspects = {};
// A tree stores stretch factors; its real size is the species' size times them.
const treeH = t => KINDS[t.kind].h * t.sy, treeW = t => KINDS[t.kind].h * (aspects[t.kind] ?? 1) * t.sx;

// --- level data ---------------------------------------------------------------------------
// A road node: position, half-width w, and an optional hand-set tangent m (null = follow its neighbours), scaled by tension.
const node = (x, z, w = 2.9) => ({ x, z, w, m: null, tension: 1 });
// The Random button: a road wandering across the square from the west edge, trees scattered off it.
function randomLevel(seed) {
  const rnd = mulberry32(seed), road = [];
  let x = -SIZE * 0.45, z = (rnd() - 0.5) * SIZE * 0.6, heading = (rnd() - 0.5) * 0.8;
  const w = 2.5 + rnd() * 2;
  while (Math.abs(x) <= SIZE * 0.45 && Math.abs(z) <= SIZE * 0.45 && road.length < 30) {
    road.push(node(x, z, w * (0.85 + rnd() * 0.3)));
    heading = Math.max(-1.2, Math.min(1.2, heading + (rnd() - 0.5) * 1.6 - z / SIZE)); // keeps drifting east, pulled back toward the middle
    const step = 40 + rnd() * 60;
    x += Math.cos(heading) * step; z += Math.sin(heading) * step;
  }
  return { ...scatter([road], rnd, 60 + Math.floor(rnd() * 160)), size: SIZE, seed: Math.floor(rnd() * 1e6), relief: 10 + Math.floor(rnd() * 40) };
}
function scatter(roads, rnd, count) {
  const trees = [], s = roadSamples(roads), kind = $("kind").value || "tree.png";
  while (trees.length < count) {
    const t = { x: (rnd() - 0.5) * SIZE * 0.9, z: (rnd() - 0.5) * SIZE * 0.9, rot: rnd() * 360, sx: 1, sy: 0.8 + rnd() * 0.4, kind };
    if (nearestRoad(t.x, t.z, s).d > 10) trees.push(t);
  }
  return { roads, trees };
}
function defaultLevel() {
  const k = SIZE / 600, chain = pts => pts.map(([x, z]) => node(x * k, z * k));
  const roads = [chain([[-260, 40], [-170, -30], [-80, 10], [0, -60], [90, -10], [170, 70], [260, 20]]), chain([[0, -60], [40, -150], [70, -250]])];
  return { ...scatter(roads, mulberry32(3), 140), size: SIZE, seed: 1, relief: 25 };
}
let level;
// Saves are packed: trees as base64 `treesBin` (legacy: [x, z, rot, sx, sy, kind index] rows), the height grid as base64 int16 decimetres, the ground cover as base64 bytes.
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100;
function toB64(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192)); // spreading a whole grid at once overflows the call stack
  return btoa(bin);
}
function fromB64(str) {

  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);

}
// The biome grid: one id per BIOME_CELL square (row 0 = north edge), saved run-length encoded as `biomeRle`.
const BIOME_CELL = 10, BN = () => Math.ceil(SIZE / BIOME_CELL);
const BIOMES = [{ id: 0, name: "Forest", col: "#3d8a3a" }, { id: 1, name: "Snow", col: "#eef4f8" }];
// Cover grids are saved run-length encoded: base64 of (cell type byte, run length as a little-endian varint) pairs in row-major order.
function rleEncode(a) {

    let j = i + 1; while (j < a.length && a[j] === a[i]) j++;

    out.fill(t, o, o += n);

// Trees are saved as 7 bytes each (little-endian): x, z as uint16 tenths of a metre from the square's corner, rotation as uint8 of 360, scale as uint8 hundredths, kind index.
function packTrees(trees, kinds, size) {
  const dv = new DataView(new ArrayBuffer(trees.length * 7)), q = v => Math.max(0, Math.min(65535, Math.round((v + size / 2) * 10)));
  trees.forEach((t, i) => {
    dv.setUint16(i * 7, q(t.x), true); dv.setUint16(i * 7 + 2, q(t.z), true);
    dv.setUint8(i * 7 + 4, Math.round(t.rot / 360 * 256) & 255); dv.setUint8(i * 7 + 5, Math.max(0, Math.min(255, Math.round(t.sx * 100)))); dv.setUint8(i * 7 + 6, kinds.indexOf(t.kind));

}

}
function pack(l) {
  const kinds = [...new Set(l.trees.map(t => t.kind))];

  delete out.road; delete out.trees;
  if (!out.spectators?.length) delete out.spectators;
  if (out.size === 600) delete out.size;
  if (l.heightmap) {
    const bytes = new Uint8Array(Int16Array.from(l.heightmap, h => Math.round(h * 10)).buffer);
    out.heightmap = toB64(bytes);
  }
  if (l.cover?.some(v => v)) {
    out.coverRle = toB64(rleEncode(l.cover)); delete out.cover;
    out.coverKinds = Object.fromEntries(Object.entries(COVER_RENDER).map(([id, layers]) => [id, layers.map(([name, dens]) => [{ ...PRESET_BASE, ...PRESETS[name] }, dens])]));
  } else { delete out.cover; delete out.coverRle; delete out.coverKinds; }

}
function unpack(l) {
  if (l?.road && !l.roads) { l = { ...l, roads: [l.road] }; delete l.road; }
  if (!l?.kinds) return l; // an unpacked (older) save
  const out = { ...l, trees: typeof l.treesBin === "string" ? unpackTrees(l.treesBin, l.kinds, l.size ?? 600) : l.trees.map(([x, z, rot, sx, sy, k]) => ({ x, z, rot, sx, sy, kind: l.kinds[k] })) };
  delete out.kinds; delete out.treesBin; delete out.coverKinds;
  if (typeof l.heightmap === "string") out.heightmap = Float32Array.from(new Int16Array(fromB64(l.heightmap).buffer), v => v / 10);
  if (typeof l.coverRle === "string") { out.cover = rleDecode(fromB64(l.coverRle), (l.size ?? 600) ** 2); delete out.coverRle; }
  else if (typeof l.cover === "string") out.cover = fromB64(l.cover);
  if (typeof l.biomeRle === "string") { out.biome = rleDecode(fromB64(l.biomeRle), Math.ceil((l.size ?? 600) / BIOME_CELL) ** 2); delete out.biomeRle; }
  return out;
}
// heightWebp / coverWebp are lossless WebP images (height: R/G = high/low byte of decimetres + 32768; cover: the type id), the form the game ships.
async function webpPixels(b64) {
  const bmp = await createImageBitmap(new Blob([fromB64(b64)], { type: "image/webp" }), { colorSpaceConversion: "none", premultiplyAlpha: "none" });
  const c = document.createElement("canvas"); c.width = bmp.width; c.height = bmp.height;
  const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(bmp, 0, 0);
  return g.getImageData(0, 0, c.width, c.height).data;
}
async function unpackAsync(l) {
  if (typeof l?.heightWebp === "string" || typeof l?.coverWebp === "string") {
    l = { ...l };
    if (typeof l.heightWebp === "string") {
      const px = await webpPixels(l.heightWebp);
      l.heightmap = Float32Array.from({ length: px.length / 4 }, (_, i) => ((px[i * 4] << 8 | px[i * 4 + 1]) - 32768) / 10);
      delete l.heightWebp;
    }
    if (typeof l.coverWebp === "string") {
      const px = await webpPixels(l.coverWebp);
      l.cover = Uint8Array.from({ length: px.length / 4 }, (_, i) => px[i * 4]);

// The download keeps the height grid and cover as WebP; each image is read back, and kept in the older format if any value didn't survive.
async function toWebp(px, n) {
  const c = document.createElement("canvas"); c.width = c.height = n;
  c.getContext("2d").putImageData(new ImageData(px, n, n), 0, 0);
  const blob = await new Promise(r => c.toBlob(r, "image/webp", 1)); // Chrome writes lossless WebP at quality 1

}

    l.heightmap.forEach((h, i) => { const u = Math.round(h * 10) + 32768; px[i * 4] = u >> 8; px[i * 4 + 1] = u & 255; px[i * 4 + 3] = 255; });
    const b64 = await toWebp(px, n);
    if (b64) { out.heightWebp = b64; delete out.heightmap; } else console.warn("height grid didn't survive WebP; saved as int16");
  }
  if (out.coverRle) {
    const n = l.size ?? 600, px = new Uint8ClampedArray(n * n * 4);
    l.cover.forEach((id, i) => { px[i * 4] = px[i * 4 + 1] = px[i * 4 + 2] = id; px[i * 4 + 3] = 255; });
    const b64 = await toWebp(px, n);
    if (b64) { out.coverWebp = b64; delete out.coverRle; } else console.warn("cover didn't survive WebP; saved run-length encoded");

try { level = unpack(JSON.parse(localStorage.getItem("levelEditorLab"))); } catch (e) {}
// Undo history: a copy of the level at every save(). The cover grid is only copied when it changed since the last copy, as it is megabytes at 5 km.
let history = [], historyAt = -1, coverEdited = true, restoring = false;
const cloneLevel = (l, cover) => ({ ...structuredClone({ ...l, cover: null, heightmap: null }), heightmap: l.heightmap, cover });
function snapshot() {
  const prev = history[historyAt];

  history.push(cloneLevel(level, coverEdited || !prev ? level.cover.slice() : prev.cover));

function stepHistory(d) {
  const s = history[historyAt + d];

function save() { if (!restoring) snapshot(); if (big()) return; try { localStorage.setItem("levelEditorLab", JSON.stringify(pack(level))); } catch (e) {} }

// --- ground cover: a 1 m grid of type ids over the square (row 0 = north edge, col 0 = west edge, 0 = none) ---
const COVER_DEFAULT = [
  { id: 1, name: "Verge grass", col: "#8fd23f" }, { id: 2, name: "Molinia", col: "#d9c27a" },
  { id: 3, name: "Heather", col: "#a24fb0" }, { id: 4, name: "Bilberry / scrub", col: "#2f7a46" },
];
const coverOverlay = document.createElement("canvas");
const coverTool = () => $("tool").value === "cover";
const specTool = () => $("tool").value === "spec";
let coverRgbs = {};
function coverPaintRect(c0, r0, c1, r1) {
  const w = c1 - c0 + 1, h = r1 - r0 + 1, img = new ImageData(w, h), d = img.data;
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {

function coverRebuild() {
  coverRgbs = Object.fromEntries(level.coverTypes.map(t => { const c = parseInt(t.col.slice(1), 16); return [t.id, [c >> 16, c >> 8 & 255, c & 255]]; }));

function paintCover(x, z, r, id) {

  for (let rr = r0; rr <= r1; rr++) for (let cc = c0; cc <= c1; cc++) {
    if (Math.hypot(cc + 0.5 - SIZE / 2 - x, rr + 0.5 - SIZE / 2 - z) <= r) level.cover[rr * SIZE + cc] = id;
  }

}
// Paints a round dab every half brush-width along the drag so fast strokes leave no gaps.
function coverStroke(d, [x, z]) {
  const r = +$("brush").value, id = $("coverMode").value === "erase" || d.shift ? 0 : +$("coverType").value, [lx, lz] = d.last;
  const n = Math.max(1, Math.ceil(Math.hypot(x - lx, z - lz) / Math.max(1, r / 2)));

const biomeOverlay = document.createElement("canvas");
const biomeTool = () => $("tool").value === "biome", paintTool = () => coverTool() || biomeTool();
function biomeRebuild() {
  const n = BN(), img = new ImageData(n, n), rgbs = BIOMES.map(b => { const c = parseInt(b.col.slice(1), 16); return [c >> 16, c >> 8 & 255, c & 255]; });
  level.biome.forEach((id, i) => { const rgb = rgbs[id]; if (rgb) { img.data.set(rgb, i * 4); img.data[i * 4 + 3] = 255; } });

const COVER_FADE = [22, 34], COVER_REACH = COVER_FADE[1] + 10;

  1: [["Hafren verge grass", 3], ["Hafren soft rush", 0.15]],
  2: [["Hafren molinia (straw tussock)", 1.2]],
  3: [["Hafren heather", 0.5]],
  4: [["Hafren bilberry mound", 0.35], ["Hafren scrub mound", 0.03]],
};
U.uFade.value.set(...COVER_FADE); U.uWind.value = 0.3;
const tuftKits = {};
function tuftKit(name) {
  if (tuftKits[name]) return tuftKits[name];
  const s = { ...PRESET_BASE, ...PRESETS[name] };
  return tuftKits[name] = { geo: buildTuft(1, true, s), mat: tuftMaterial(false, s.shape === "bush" ? s.bushHeight : s.height) };
}
let coverMeshes = [], coverAt = null, cover3DDirty = true, coverGenAt = 0;
function rebuild3DCover() {
  for (const m of coverMeshes) { scene.remove(m); m.dispose(); }
  coverMeshes = []; coverAt = [view.x, view.z]; cover3DDirty = false; coverGenAt = performance.now();
  if (!level.cover) return;
  paintCoverTint();
  const lo = v => Math.max(0, Math.floor(v + SIZE / 2 - COVER_REACH)), hi = v => Math.min(SIZE - 1, Math.ceil(v + SIZE / 2 + COVER_REACH));
  const out = {}, v = new THREE.Vector3(), s3 = new THREE.Vector3();
  for (let rr = lo(view.z); rr <= hi(view.z); rr++) for (let cc = lo(view.x); cc <= hi(view.x); cc++) {
    const id = level.cover[rr * SIZE + cc], wx = cc - SIZE / 2, wz = rr - SIZE / 2;
    if (!id || Math.hypot(wx + 0.5 - view.x, wz + 0.5 - view.z) > COVER_REACH) continue;
    (COVER_RENDER[id] ?? []).forEach(([name, dens], li) => {
      const salt = (id * 8 + li + 1) * 64, n = Math.min(15, Math.floor(dens + hash2(cc, rr, salt + 63)));
      for (let k = 0; k < n; k++) {
        const x = wx + hash2(cc, rr, salt + k * 4), z = wz + hash2(cc, rr, salt + k * 4 + 1), sc = 0.7 + 0.6 * hash2(cc, rr, salt + k * 4 + 3);
        m4.compose(v.set(x, heightAt(x, z), z), q4.setFromAxisAngle(UP, hash2(cc, rr, salt + k * 4 + 2) * Math.PI * 2), s3.set(sc, sc, sc));
        m4.toArray(out[name] ??= [], out[name].length);
      }
    });
  }
  for (const [name, arr] of Object.entries(out)) {
    const mesh = new THREE.InstancedMesh(tuftKit(name).geo, tuftKit(name).mat, arr.length / 16);
    mesh.instanceMatrix.array.set(arr); mesh.frustumCulled = false; // instances sit far from the geometry's own bounds
    scene.add(mesh); coverMeshes.push(mesh);
  }
}

// 3D camera: orbits the 2D view's centre; dragging here only turns it.
let orbit = null;
renderer.domElement.onpointerdown = e => { renderer.domElement.setPointerCapture(e.pointerId); orbit = { x: e.clientX, y: e.clientY }; };
renderer.domElement.onpointermove = e => {
  if (!orbit) return;
  cam.yaw -= (e.clientX - orbit.x) * 0.006; cam.pitch = Math.max(0.03, Math.min(1.55, cam.pitch + (e.clientY - orbit.y) * 0.006));
  orbit = { x: e.clientX, y: e.clientY }; mapDirty = true;
};
renderer.domElement.onpointerup = () => orbit = null;
renderer.domElement.onwheel = e => { e.preventDefault(); cam.dist = Math.max(5, Math.min(600, cam.dist * Math.exp(e.deltaY * 0.0015))); };

// --- frame loop: rebuild whatever changed, then draw both views ------------------------------
let terrainDirty = true, treesDirty = true, mapDirty = true, frames = 0;
let windowDirty = true;
function changed(terrainToo) { if (terrainToo) terrainDirty = true; treesDirty = true; mapDirty = true; treeGridDirty = true; }
function resize() {
  cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio;
  renderer.setSize(wrap.clientWidth, wrap.clientHeight); camera.aspect = wrap.clientWidth / wrap.clientHeight; camera.updateProjectionMatrix();
  mapDirty = true;
}
addEventListener("resize", resize);
let lastT = performance.now();
function frame() {
  const now = performance.now(); walk(Math.min(0.1, (now - lastT) / 1000)); lastT = now;
  if (terrainDirty) { rebuildRoads(); terrainDirty = false; windowDirty = true; }
  if (!T.full && Math.hypot(view.x - (T.x0 + WW() / 2), view.z - (T.z0 + WW() / 2)) > WIN_MOVE) windowDirty = true;
  if (windowDirty) {
    placeWindow(); rebuildGrid(); rebuild3DTerrain(); windowDirty = false; treesDirty = mapDirty = cover3DDirty = true;
    if (T.full) buildContours(heights, G, GCELL, 1, CONTOUR_M);
  }
  if (treesDirty) { rebuild3DTrees(); rebuild3DBuildings(); rebuild3DLogPiles(); rebuild3DSpectators(); treesDirty = false; }
  U.uCenter.value.set(view.x, 0, view.z); U.uTime.value = now / 1000;
  if (!coverAt || cover3DDirty && now - coverGenAt > 150 || Math.hypot(view.x - coverAt[0], view.z - coverAt[1]) > 10) rebuild3DCover();
  if (++frames % 15 === 0) $("sight").textContent = big()
    ? `${SIZE} m level: the 3D view shows a ${WW()} m window around the view centre${juncCut ? ` (${juncCut} junctions in it are not shaded)` : ""}`
    : "";
  if (mapDirty) { draw2D(); mapDirty = false; }
  const ty = heightAt(view.x, view.z) + 1.5;
  camera.position.set(view.x + Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist, ty + Math.sin(cam.pitch) * cam.dist, view.z + Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist);
  camera.lookAt(view.x, ty, view.z);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

if (!level?.roads?.every(road => road.every(n => "tension" in n)) || !level.trees.every(t => "sx" in t)) level = defaultLevel();
resize(); loaded(); frame();
// ?level=levels/foo.json opens that save (relative to this page) instead of the last session
const levelUrl = new URLSearchParams(location.search).get("level");
if (levelUrl) fetch(levelUrl).then(r => r.json()).then(async l => { level = await unpackAsync(l); loaded(); }).catch(err => alert("Couldn't load " + levelUrl + ": " + err.message));
</script>
</body>
</html>
