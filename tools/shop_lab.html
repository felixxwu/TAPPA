<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shop Lab</title>
<style>
  body { margin: 0; display: flex; font: 13px system-ui, sans-serif; background: #15171a; color: #ddd; height: 100vh; }
  #side { width: 280px; padding: 12px; overflow-y: auto; background: #1d2024; box-sizing: border-box; flex-shrink: 0; }
  #side label { display: block; margin: 9px 0 2px; }
  #side select, #side input[type=number], #side input[type=text], #side textarea, #side input[type=range] { width: 100%; box-sizing: border-box; }
  #side textarea { height: 150px; font: 11px ui-monospace, monospace; }
  #side .row { display: flex; gap: 6px; }
  #side button { margin-top: 6px; display: block; width: 100%; }
  #stats { margin-top: 14px; white-space: pre; font-family: ui-monospace, monospace; font-size: 12px; color: #aab; }
  #wrap { flex: 1; position: relative; }
  #wrap canvas { display: block; width: 100%; height: 100%; }
  .hint { color: #889; font-size: 11px; margin-top: 10px; }
</style>
</head>
<body>
<div id="side">
  <label>Seed</label>
  <div class="row"><input id="seed" type="number" value="1"><button id="rnd" style="width:auto;margin:0">🎲</button></div>
  <label>Sign text</label>
  <input id="sign" type="text" value="">
  <label>Style</label>
  <select id="style"></select>
  <label>Palette</label>
  <select id="pal"></select>
  <label>Size <span id="sizeV"></span></label>
  <input id="size" type="range" min="0.8" max="1.6" step="0.05" value="1">
  <label><input type="checkbox" id="bunting" checked> Bunting and flags</label>
  <button id="copy">Copy model JSON</button>
  <div id="stats"></div>
  <div class="hint">Drag to orbit, scroll to zoom, right-drag to pan. Cars and prices are not part of the model: the game parks the stock in the open yard in front. Parts are a fixed display set.</div>
</div>
<div id="wrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="shops.js"></script>
<script>
// Preview page that generates a roadside car shop / tuning garage from a seed; cars and prices are not modelled.
const $ = id => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.outputEncoding = THREE.sRGBEncoding;
$("wrap").appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#a9c3d6");
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000); camera.position.set(16, 9, 22);
const { PALETTES, STYLE_IDS, ARCH } = Shops;
$("pal").innerHTML = Object.keys(PALETTES).map(p => `<option>${p}</option>`).join("");
$("style").innerHTML = '<option value="">Auto (by seed)</option>' + STYLE_IDS.map(k => `<option value="${k}">${ARCH[k].label}</option>`).join("");
const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.target.set(0, 1.5, 4);
scene.add(new THREE.HemisphereLight("#cfe0ef", "#4a5a30", 0.75));
const sun = new THREE.DirectionalLight("#fff4e0", 0.9); sun.position.set(8, 14, 10); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: "#5a7a38" }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; scene.add(ground);

let group = new THREE.Group(), model = {}; scene.add(group);
function frame() {
  const b = new THREE.Box3().setFromObject(group), c = b.getCenter(new THREE.Vector3()), r = b.getSize(new THREE.Vector3()).length() / 2;
  controls.target.set(c.x, 1.5, c.z); camera.position.set(c.x + r * 0.75, r * 0.6, c.z + r * 1.25); controls.update();
}
function regen(fit) {
  scene.remove(group); group.traverse(o => o.geometry?.dispose());
  const seed = +$("seed").value, sign = $("sign").value || Shops.defaultSign(seed);
  $("sizeV").textContent = $("size").value;
  const res = Shops.build(seed, { pal: $("pal").value, size: +$("size").value, sign, bunting: $("bunting").checked, style: $("style").value });
  group = res.root; scene.add(group);
  if (fit === true) frame();
  let tris = 0, meshes = 0; group.traverse(o => { if (o.isMesh) { meshes++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
  const i = res.info;
  model = { seed, style: i.style, pal: $("pal").value, size: +$("size").value, sign, bunting: $("bunting").checked };
  $("stats").textContent = `sign        ${sign}\nstyle       ${ARCH[i.style].label}\n            ${i.desc}\nsign type   ${i.sign}\nfence       ${i.fence}\nmeshes      ${meshes}\ntriangles   ${tris}`;
}
for (const id of ["seed", "style", "size"]) $(id).addEventListener("input", () => regen(true));
for (const id of ["sign", "pal", "bunting"]) $(id).addEventListener("input", () => regen(false));
$("rnd").onclick = () => { $("seed").value = Math.floor(Math.random() * 1e6); regen(true); };
$("copy").onclick = () => navigator.clipboard.writeText(JSON.stringify(model));

function resize() { const w = $("wrap").clientWidth, h = $("wrap").clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
const q = new URLSearchParams(location.search);
if (q.get("seed")) $("seed").value = q.get("seed");
if (q.get("sign")) $("sign").value = q.get("sign");
if (q.get("style")) $("style").value = q.get("style");
regen(true);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
