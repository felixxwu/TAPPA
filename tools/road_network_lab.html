<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Road Network Lab</title>
<style>
  body { margin: 0; display: flex; font: 13px system-ui, sans-serif; background: #15171a; color: #ddd; height: 100vh; }
  #side { width: 270px; padding: 12px; overflow-y: auto; background: #1d2024; box-sizing: border-box; }
  #side label { display: block; margin: 10px 0 2px; }
  #side input[type=range], #side select, #side input[type=number] { width: 100%; box-sizing: border-box; }
  #side .row { display: flex; gap: 6px; }
  #side button { margin-top: 6px; }
  #stats { margin-top: 14px; white-space: pre; font-family: ui-monospace, monospace; font-size: 12px; color: #aab; }
  #wrap { flex: 1; overflow: hidden; position: relative; }
  #view3d { display: none; position: absolute; inset: 0; background: #9fb8c8; }
  #view3d canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; }
  #close3d { position: absolute; top: 8px; left: 8px; z-index: 1; }
  #info3d { position: absolute; bottom: 8px; left: 8px; z-index: 1; color: #123; font: 12px ui-monospace, monospace; }
  canvas { background: #0d2a3a; display: block; cursor: grab; }
  .hint { color: #889; font-size: 11px; margin-top: 10px; }
  .val { float: right; color: #9ab; }
</style>
</head>
<body>
<div id="side">
  <label>Seed</label>
  <div class="row"><input id="seed" type="number" value="5687"><button id="rnd">🎲</button></div>

  <label>Algorithm</label>
  <select id="algo">
    <option value="growth">Radial growth (organic tree, forks)</option>
    <option value="growthPruned" selected>Radial growth, dead ends pruned</option>
    <option value="ports">Chunk ports (local tiling)</option>
    <option value="colonize">Space colonisation (attractor-led)</option>
    <option value="tensor">Tensor field streamlines</option>
    <option value="mstloops">MST + loops (detour-pruned)</option>
    <option value="mst">MST from spawn (pure tree)</option>
    <option value="rng">Relative neighbourhood graph</option>
    <option value="gabriel">Gabriel graph</option>
    <option value="detour">Gabriel pruned by detour (old overworld)</option>
  </select>

  <div id="params"></div>

  <label><input type="checkbox" id="wiggle" checked> Preview road wiggle (layer 2)</label>
  <label><input type="checkbox" id="rings" checked> Show biome rings</label>
  <label><input type="checkbox" id="water" checked> Lakes (block nodes + roads)</label>
  <label><input type="checkbox" id="terrain" checked> Road-first terrain (heightmap)</label>
  <button id="open3d">3D view of the square at map centre</button>
  <button id="copy">Copy settings to clipboard</button> <span id="copied" class="hint"></span>

  <div id="stats"></div>
  <div class="hint">Drag to pan, scroll to zoom, double-click to reset view.<br>
  Click a node: shortest road distance from spawn.<br>
  ● spawn &nbsp; ◆ rest stop &nbsp; ○ junction &nbsp; ▪ dead end</div>
</div>
<div id="wrap"><canvas id="c"></canvas>
  <div id="view3d"><button id="close3d">✕ close 3D (drag orbit, scroll zoom, right-drag pan)</button><div id="info3d"></div></div>
</div>

<script>
// Throwaway spike for todo/2026-10-19-free-roam-pivot.md: compare island road-network layouts.
const $ = id => document.getElementById(id);

const PARAMS = {
  common: [
    ["radius", "Island radius (m)", 1000, 20000, 10000, 250],
    ["ringCount", "Biome rings", 2, 8, 4, 1],
    ["spacing", "Node min spacing (m)", 50, 1500, 300, 25],
    ["restSpacing", "Rest stop every (m of road)", 50, 5000, 1050, 100],
    ["baseScale", "Base height scale (m)", 500, 8000, 500, 100],
    ["roadRelief", "Base height variation (m)", 0, 400, 5, 5],
    ["waterLevel", "Water level (m)", -20, 10, -2, 1],
    ["roadTwist", "Road twistiness (bend size)", 0, 1.5, 0.24, 0.01],
    ["bendLen", "Bend length (m)", 30, 800, 150, 10],
    ["cornerTurn", "Max corner turn (deg)", 1, 180, 20, 1],
  ],
  ports: [
    ["cell", "Cell size (m)", 200, 1500, 500, 25],
    ["density", "Border crossing chance", 0.1, 1, 0.6, 0.01],
    ["falloff", "Outer-ring thinning", 0, 1, 0.4, 0.01],
    ["hubJitter", "Hub jitter", 0, 0.45, 0.3, 0.01],
  ],
  colonize: [
    ["attractors", "Attractors", 20, 1000, 250, 10],
    ["influence", "Influence radius (m)", 300, 4000, 1500, 50],
    ["kill", "Kill distance (m)", 80, 800, 250, 10],
    ["cstep", "Growth step (m)", 40, 300, 120, 10],
  ],
  tensor: [
    ["majors", "Radial roads from spawn", 2, 10, 5, 1],
    ["twist", "Noise twist", 0, 1.5, 0.5, 0.01],
    ["spiral", "Spiral (deg)", -60, 60, 0, 1],
    ["fieldScale", "Field noise scale (m)", 500, 6000, 2500, 50],
    ["minorSpacing", "Cross-road spacing (m)", 300, 3000, 900, 25],
    ["dsep", "Min cross-road gap (m)", 100, 2000, 500, 25],
    ["maxLen", "Max road length (km)", 1, 20, 8, 0.5],
  ],
  growth: [
    ["step", "Segment length (m)", 25, 1200, 750, 25],
    ["fork", "Fork chance per step", 0, 0.8, 0.38, 0.01],
    ["forkAngle", "Fork angle (deg)", 15, 180, 109, 1],
    ["jitter", "Heading jitter (deg)", 0, 180, 39, 1],
    ["outward", "Outward pull", 0, 1, 0.48, 0.01],
    ["loopChance", "Join-on-collide chance", 0, 1, 1, 0.01],
    ["starts", "Roads leaving spawn", 1, 6, 1, 1],
  ],
  mstloops: [["detour", "Add loop if detour ratio >", 1.1, 4, 2, 0.05]],
  detour: [["detour", "Prune if 2-hop ≤ ratio ×", 1.0, 3, 1.6, 0.05]],
  mst: [], rng: [], gabriel: [],
  terrain: [
    ["lakeDepth", "Lake depth factor", 0.2, 4, 1.6, 0.1],
    ["shoreBand", "Shore band (m above water)", 1, 100, 5, 1],
    ["lakeBank", "Bank from road to lake bed (m)", 0, 100, 12, 1],
    ["mountain", "Mountain height (m)", 0, 2500, 300, 10],
    ["flatW", "Flat band beside road (m)", 2, 200, 2, 2],
    ["mountainDist", "Distance to full mountain (m)", 100, 4000, 400, 25],
    ["bank", "Ribbon bank / drop (m)", 0, 300, 47, 1],
    ["ribbonW", "Ribbon width (m)", 20, 1000, 320, 5],
    ["bumpHeight", "Bump height (m)", 0, 30, 5, 0.5],
    ["bumpSize", "Bump size (m)", 10, 400, 50, 5],
    ["contour", "Contour interval (m)", 5, 250, 135, 5],
    ["area3d", "3D area size (m)", 500, 20000, 8000, 100],
    ["res3d", "3D grid resolution", 64, 1200, 800, 8],
    ["exag", "3D height exaggeration", 0.5, 4, 1, 0.1],
  ],
};
PARAMS.growthPruned = [...PARAMS.growth, ["pruneLen", "Prune dead ends up to (m)", 0, 5000, 1000, 25]];
const state = {};

function buildParams() {
  const algo = $("algo").value;
  const box = $("params");
  box.innerHTML = "";
  for (const [key, name, min, max, def, step] of [...PARAMS.common, ...PARAMS[algo], ...($("terrain").checked ? PARAMS.terrain : [])]) {
    if (!(key in state)) state[key] = def;
    const l = document.createElement("label");
    l.innerHTML = `${name} <span class="val">${state[key]}</span>`;
    const r = document.createElement("input");
    Object.assign(r, { type: "range", min, max, step, value: state[key] });
    r.oninput = () => { state[key] = +r.value; l.querySelector(".val").textContent = r.value; draw(); };
    box.append(l, r);
  }
}

// --- deterministic helpers ---------------------------------------------------------------
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hash2(x, y, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 2147483647);
  h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
// Classic 2D gradient (Perlin) noise: a hashed gradient at each lattice corner, quintic fade.
const GRADS = [[1, 0], [-1, 0], [0, 1], [0, -1], [0.7071067811865476, 0.7071067811865476],
  [-0.7071067811865476, 0.7071067811865476], [0.7071067811865476, -0.7071067811865476], [-0.7071067811865476, -0.7071067811865476]];
function perlin(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const g = (ix, iy, dx, dy) => { const k = GRADS[Math.floor(hash2(ix, iy, s) * 8)]; return k[0] * dx + k[1] * dy; };
  const n00 = g(xi, yi, xf, yf), n10 = g(xi + 1, yi, xf - 1, yf), n01 = g(xi, yi + 1, xf, yf - 1), n11 = g(xi + 1, yi + 1, xf - 1, yf - 1);
  const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
  const nx0 = n00 + (n10 - n00) * u, nx1 = n01 + (n11 - n01) * u;
  return nx0 + (nx1 - nx0) * v;
}
function fbm(x, y, s) { return vnoise(x, y, s) * 0.6 + vnoise(x * 2.1, y * 2.1, s + 7) * 0.3 + vnoise(x * 4.3, y * 4.3, s + 13) * 0.1; }

// Plain sqrt rather than Math.hypot, which rounds differently: the game mirrors this maths exactly.
const hyp = (x, y) => Math.sqrt(x * x + y * y);
const dist = (a, b) => hyp(a.x - b.x, a.y - b.y);

// --- the island --------------------------------------------------------------------------
function coastR(ang, seed, R) { return R * (0.82 + 0.18 * fbm(Math.cos(ang) * 2 + 5, Math.sin(ang) * 2 + 5, seed)); }
function onLand(p, seed, R) { return hyp(p.x, p.y) < coastR(Math.atan2(p.y, p.x), seed, R) - 150; }
// The base height: low-frequency noise that depends on nothing else, so lakes can be decided
// before the roads and the roads can then avoid them. Lifted near spawn so spawn is always dry.
function baseH(p, seed) {
  const raw = state.roadRelief * (fbm(p.x / state.baseScale + 3, p.y / state.baseScale + 3, seed + 41) - 0.5) * 2;
  return raw + (1 - smooth(300, 900, hyp(p.x, p.y))) * Math.max(0, state.waterLevel + 10 - raw);
}
// A lake is wherever the base height sits below the water level.
const isLake = (p, seed) => $("water").checked && baseH(p, seed) < state.waterLevel;
function isWater(p, seed, R) { return !onLand(p, seed, R) || isLake(p, seed); }
function ringOf(p, seed, R, n) {
  const wob = (fbm(p.x / 1500 + 9, p.y / 1500 + 9, seed + 3) - 0.5) * 0.25;
  return Math.max(0, Math.min(n - 1, Math.floor((hyp(p.x, p.y) / (R * 0.82) + wob) * n)));
}
function segHitsWater(a, b, seed, R) {
  const n = Math.ceil(dist(a, b) / 60 - 1e-9);
  for (let i = 1; i < n; i++) if (isWater({ x: a.x + (b.x - a.x) * i / n, y: a.y + (b.y - a.y) * i / n }, seed, R)) return true;
  return false;
}
function segsCross(a, b, c, d) {
  const o = (p, q, r) => Math.sign((q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x));
  return o(a, b, c) * o(a, b, d) < 0 && o(c, d, a) * o(c, d, b) < 0;
}

function poisson(rand, seed, R, spacing) {
  const pts = [{ x: 0, y: 0 }];
  for (let tries = 0; tries < 30000 && pts.length < 2000; tries++) {
    const p = { x: (rand() * 2 - 1) * R, y: (rand() * 2 - 1) * R };
    if (isWater(p, seed, R)) continue;
    if (pts.every(q => dist(p, q) >= spacing)) pts.push(p);
  }
  return pts;
}

// --- algorithms: each returns { nodes: [{x,y}], edges: [[i,j]] } --------------------------
function candidateEdges(nodes, seed, R, maxLen) {
  const out = [];
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
    const d = dist(nodes[i], nodes[j]);
    if (d <= maxLen && !segHitsWater(nodes[i], nodes[j], seed, R)) out.push([i, j, d]);
  }
  return out;
}
function gabriel(nodes, cands) {
  return cands.filter(([i, j]) => {
    const a = nodes[i], b = nodes[j], m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, r2 = (dist(a, b) / 2) ** 2;
    return nodes.every((p, k) => k === i || k === j || (p.x - m.x) ** 2 + (p.y - m.y) ** 2 >= r2);
  });
}
function rng(nodes, cands) {
  return cands.filter(([i, j, d]) =>
    nodes.every((p, k) => k === i || k === j || Math.max(dist(p, nodes[i]), dist(p, nodes[j])) >= d));
}
function mst(n, edges) {
  const parent = [...Array(n).keys()], find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
  const out = [];
  for (const e of [...edges].sort((a, b) => a[2] - b[2])) {
    const a = find(e[0]), b = find(e[1]);
    if (a !== b) { parent[a] = b; out.push(e); }
  }
  return out;
}
function shortest(n, edges, nodes, src, skip) {
  const adj = Array.from({ length: n }, () => []);
  for (const e of edges) if (e !== skip) { adj[e[0]].push([e[1], e[2]]); adj[e[1]].push([e[0], e[2]]); }
  const d = new Array(n).fill(Infinity), prev = new Array(n).fill(-1), done = new Array(n).fill(false);
  d[src] = 0;
  for (;;) {
    let u = -1;
    for (let i = 0; i < n; i++) if (!done[i] && d[i] < Infinity && (u < 0 || d[i] < d[u])) u = i;
    if (u < 0) break;
    done[u] = true;
    for (const [v, w] of adj[u]) if (d[u] + w < d[v]) { d[v] = d[u] + w; prev[v] = u; }
  }
  return { d, prev };
}

function graphAlgo(kind, rand, seed, R) {
  const nodes = poisson(rand, seed, R, state.spacing);
  const cands = gabriel(nodes, candidateEdges(nodes, seed, R, state.spacing * 3));
  if (kind === "gabriel") return { nodes, edges: cands };
  if (kind === "rng") return { nodes, edges: rng(nodes, cands) };
  const tree = mst(nodes.length, cands);
  if (kind === "mst") return { nodes, edges: tree };
  if (kind === "mstloops") {
    const edges = [...tree];
    for (const e of cands.filter(e => !tree.includes(e)).sort((a, b) => a[2] - b[2])) {
      const via = shortest(nodes.length, edges, nodes, e[0]).d[e[1]];
      if (via > e[2] * state.detour) edges.push(e);
    }
    return { nodes, edges };
  }
  // detour: longest first, drop an edge whose ends are already joined by a short enough detour
  let edges = [...cands];
  for (const e of [...cands].sort((a, b) => b[2] - a[2])) {
    const via = shortest(nodes.length, edges, nodes, e[0], e).d[e[1]];
    if (via <= e[2] * state.detour) edges = edges.filter(x => x !== e);
  }
  return { nodes, edges };
}

function growth(rand, seed, R) {
  const nodes = [{ x: 0, y: 0 }], edges = [];
  const rad = d => d * Math.PI / 180;
  const heads = [];
  for (let i = 0; i < state.starts; i++) heads.push({ at: 0, ang: (i / state.starts) * Math.PI * 2 + rand() });
  let guard = 0;
  while (heads.length && guard++ < 5000) {
    const h = heads.shift();
    const from = nodes[h.at];
    const outAng = Math.atan2(from.y, from.x);
    let ang = h.ang + rad(state.jitter) * (rand() * 2 - 1);
    if (h.at !== 0) { // lean the heading toward pointing away from spawn
      let diff = Math.atan2(Math.sin(outAng - ang), Math.cos(outAng - ang));
      ang += diff * state.outward;
    }
    const to = { x: from.x + Math.cos(ang) * state.step, y: from.y + Math.sin(ang) * state.step };
    if (isWater(to, seed, R) || segHitsWater(from, to, seed, R)) continue;
    const near = nodes.findIndex((p, k) => k !== h.at && dist(p, to) < state.spacing);
    const crosses = edges.some(([a, b]) => a !== h.at && b !== h.at && segsCross(from, to, nodes[a], nodes[b]));
    if (near >= 0 || crosses) {
      // the branch has run into existing road: maybe join it (a loop), else end here
      if (near >= 0 && rand() < state.loopChance && !edges.some(([a, b]) => (a === h.at && b === near) || (b === h.at && a === near))
          && !edges.some(([a, b]) => a !== h.at && b !== h.at && a !== near && b !== near && segsCross(from, nodes[near], nodes[a], nodes[b])))
        edges.push([h.at, near, dist(from, nodes[near])]);
      continue;
    }
    nodes.push(to);
    const idx = nodes.length - 1;
    edges.push([h.at, idx, state.step]);
    if (rand() < state.fork) {
      heads.push({ at: idx, ang: ang + rad(state.forkAngle) });
      heads.push({ at: idx, ang: ang - rad(state.forkAngle) });
    } else heads.push({ at: idx, ang });
  }
  return { nodes, edges };
}

const rad = d => d * Math.PI / 180;
const polyLen = pts => pts.reduce((s, p, i) => i ? s + dist(p, pts[i - 1]) : 0, 0);
function segInter(a, b, c, d) {
  const rx = b.x - a.x, ry = b.y - a.y, sx = d.x - c.x, sy = d.y - c.y, den = rx * sy - ry * sx;
  if (Math.abs(den) < 1e-9) return null;
  const qx = c.x - a.x, qy = c.y - a.y, t = (qx * sy - qy * sx) / den, u = (qx * ry - qy * rx) / den;
  return t > 1e-6 && t <= 1 && u >= 0 && u <= 1 ? { t, u } : null;
}

// Radial growth, then dead-end spurs (a dead end back to its junction) no longer than pruneLen
// are cut, repeatedly, so a fork whose branches all die out goes too.
function growthPruned(rand, seed, R) {
  let { nodes, edges } = growth(rand, seed, R);
  for (;;) {
    const adj = nodes.map(() => []);
    edges.forEach((e, k) => { adj[e[0]].push(k); adj[e[1]].push(k); });
    const cut = new Set();
    for (let i = 1; i < nodes.length; i++) {
      if (adj[i].length !== 1) continue;
      const spur = [];
      let cur = i, k = adj[i][0], len = 0;
      for (;;) {
        spur.push(k);
        const nxt = edges[k][0] === cur ? edges[k][1] : edges[k][0];
        len += dist(nodes[cur], nodes[nxt]);
        cur = nxt;
        if (cur === 0 || adj[cur].length !== 2) break;
        k = adj[cur][0] === k ? adj[cur][1] : adj[cur][0];
      }
      if (len <= state.pruneLen) spur.forEach(j => cut.add(j));
    }
    if (!cut.size) break;
    edges = edges.filter((_, k) => !cut.has(k));
    const used = new Set([0]);
    edges.forEach(e => { used.add(e[0]); used.add(e[1]); });
    const remap = new Map(), kept = [];
    nodes.forEach((p, i) => { if (used.has(i)) { remap.set(i, kept.length); kept.push(p); } });
    nodes = kept;
    edges = edges.map(e => [remap.get(e[0]), remap.get(e[1]), e[2]]);
  }
  return { nodes, edges };
}

// Merge runs of degree-2 nodes into single polyline edges, so step-by-step growth reads as roads.
function collapse(nodes, edges) {
  const adj = nodes.map(() => []);
  edges.forEach((e, k) => { adj[e[0]].push(k); adj[e[1]].push(k); });
  const anchor = i => i === 0 || adj[i].length !== 2;
  const remap = new Map(), outNodes = [], outEdges = [], used = new Set();
  const id = i => { if (!remap.has(i)) { remap.set(i, outNodes.length); outNodes.push(nodes[i]); } return remap.get(i); };
  for (let a = 0; a < nodes.length; a++) {
    if (!anchor(a)) continue;
    id(a);
    for (const k0 of adj[a]) {
      if (used.has(k0)) continue;
      const pts = [nodes[a]];
      let cur = a, k = k0;
      for (;;) {
        used.add(k);
        const nxt = edges[k][0] === cur ? edges[k][1] : edges[k][0];
        pts.push(nodes[nxt]);
        if (anchor(nxt)) { const e = [id(a), id(nxt), polyLen(pts)]; e.pts = pts; outEdges.push(e); break; }
        k = adj[nxt][0] === k ? adj[nxt][1] : adj[nxt][0];
        cur = nxt;
      }
    }
  }
  return { nodes: outNodes, edges: outEdges };
}

// Chunk ports: every cell border independently decides (by hash) whether a road crosses it and
// where; each cell then joins its own crossings. No global pass, so any cell can be built alone.
function ports(rand, seed, R) {
  const C = state.cell, n = Math.ceil(R / C) + 1, nodes = [{ x: 0, y: 0 }], edges = [];
  const cellPorts = new Map();
  const add = (cx, cy, i) => { const k = cx + "," + cy; if (!cellPorts.has(k)) cellPorts.set(k, []); cellPorts.get(k).push(i); };
  for (let cx = -n; cx < n; cx++) for (let cy = -n; cy < n; cy++) for (const v of [0, 1]) {
    const hx = cx * 2 + v;
    const t = 0.2 + 0.6 * hash2(hx, cy, seed + 23);
    const p = v ? { x: (cx + 0.5) * C, y: (cy - 0.5 + t) * C } : { x: (cx - 0.5 + t) * C, y: (cy + 0.5) * C };
    if (isWater(p, seed, R)) continue;
    const ring = ringOf(p, seed, R, state.ringCount);
    if (hash2(hx, cy, seed + 11) >= state.density * (1 - state.falloff * ring / Math.max(1, state.ringCount - 1))) continue;
    nodes.push(p);
    const i = nodes.length - 1;
    add(cx, cy, i);
    v ? add(cx + 1, cy, i) : add(cx, cy + 1, i);
  }
  const link = (a, b) => { if (!segHitsWater(nodes[a], nodes[b], seed, R)) edges.push([a, b, dist(nodes[a], nodes[b])]); };
  for (const [k, P] of cellPorts) {
    const [cx, cy] = k.split(",").map(Number);
    if (cx === 0 && cy === 0) { P.forEach(i => link(0, i)); continue; }
    if (P.length === 2) { link(P[0], P[1]); continue; }
    let hub = { x: (cx + (hash2(cx, cy, seed + 31) - 0.5) * 2 * state.hubJitter) * C,
                y: (cy + (hash2(cx, cy, seed + 37) - 0.5) * 2 * state.hubJitter) * C };
    if (isWater(hub, seed, R)) hub = { x: P.reduce((s, i) => s + nodes[i].x, 0) / P.length, y: P.reduce((s, i) => s + nodes[i].y, 0) / P.length };
    nodes.push(hub);
    const h = nodes.length - 1;
    P.forEach(i => link(h, i));
  }
  return { nodes, edges };
}

// Space colonisation: scattered attractors (stand-ins for loot / rest sites) pull the nearest
// branch tip toward them; an attractor is consumed once a branch reaches it.
function colonize(rand, seed, R) {
  const attr = [];
  for (let t = 0; t < state.attractors * 30 && attr.length < state.attractors; t++) {
    const p = { x: (rand() * 2 - 1) * R, y: (rand() * 2 - 1) * R };
    if (!isWater(p, seed, R)) attr.push(p);
  }
  const nodes = [{ x: 0, y: 0 }], edges = [], G = state.influence, grid = new Map();
  const key = (x, y) => Math.floor(x / G) + "," + Math.floor(y / G);
  const gridAdd = i => { const k = key(nodes[i].x, nodes[i].y); if (!grid.has(k)) grid.set(k, []); grid.get(k).push(i); };
  const nearest = (p, maxD) => {
    let best = -1, bd = maxD;
    const gx = Math.floor(p.x / G), gy = Math.floor(p.y / G);
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++)
      for (const i of grid.get((gx + dx) + "," + (gy + dy)) || []) { const d = dist(p, nodes[i]); if (d < bd) { bd = d; best = i; } }
    return best;
  };
  gridAdd(0);
  const alive = attr.map(() => true);
  for (let iter = 0; iter < 3000; iter++) {
    const pulls = new Map();
    attr.forEach((a, k) => {
      if (!alive[k]) return;
      const j = nearest(a, state.influence);
      if (j < 0) return;
      const d = dist(a, nodes[j]) || 1, v = pulls.get(j) || { x: 0, y: 0 };
      v.x += (a.x - nodes[j].x) / d; v.y += (a.y - nodes[j].y) / d;
      pulls.set(j, v);
    });
    let grew = false;
    for (const [j, v] of pulls) {
      const L = hyp(v.x, v.y);
      if (L < 1e-6) continue;
      const np = { x: nodes[j].x + v.x / L * state.cstep, y: nodes[j].y + v.y / L * state.cstep };
      if (isWater(np, seed, R) || segHitsWater(nodes[j], np, seed, R)) continue;
      const close = nearest(np, state.cstep * 0.5);
      if (close >= 0) continue;
      nodes.push(np);
      edges.push([j, nodes.length - 1, state.cstep]);
      gridAdd(nodes.length - 1);
      grew = true;
    }
    attr.forEach((a, k) => { if (alive[k] && nearest(a, state.kill) >= 0) alive[k] = false; });
    if (!grew) break;
  }
  return collapse(nodes, edges);
}

// Tensor field: a smooth direction field (radial from spawn, twisted by noise). Major roads
// follow it outward from spawn; cross roads follow the perpendicular and end in a T-junction
// when they meet another road.
function tensor(rand, seed, R) {
  const h = 40, G = 100, nodes = [{ x: 0, y: 0 }], lines = [], grid = new Map();
  const fieldAng = p => Math.atan2(p.y, p.x) + rad(state.spiral)
    + state.twist * Math.PI * (fbm(p.x / state.fieldScale + 31, p.y / state.fieldScale + 31, seed + 5) - 0.5) * 2;
  const unit = a => ({ x: Math.cos(a), y: Math.sin(a) });
  const align = (d, ref) => d.x * ref.x + d.y * ref.y < 0 ? { x: -d.x, y: -d.y } : d;
  const cells = (a, b, pad) => {
    const out = [];
    for (let gx = Math.floor((Math.min(a.x, b.x) - pad) / G); gx <= Math.floor((Math.max(a.x, b.x) + pad) / G); gx++)
      for (let gy = Math.floor((Math.min(a.y, b.y) - pad) / G); gy <= Math.floor((Math.max(a.y, b.y) + pad) / G); gy++) out.push(gx + "," + gy);
    return out;
  };
  const gridAdd = (li, si) => {
    const P = lines[li].pts;
    for (const k of cells(P[si], P[si + 1], 0)) { if (!grid.has(k)) grid.set(k, []); grid.get(k).push([li, si]); }
  };
  const hitTest = (a, b, li, ignore) => {
    let best = null;
    for (const k of cells(a, b, 0)) for (const [lj, sj] of grid.get(k) || []) {
      if (lj === li || lj === ignore) continue;
      const P = lines[lj].pts, r = segInter(a, b, P[sj], P[sj + 1]);
      if (r && (!best || r.t < best.t)) best = { lj, sj, t: r.t, u: r.u, point: { x: a.x + (b.x - a.x) * r.t, y: a.y + (b.y - a.y) * r.t } };
    }
    return best;
  };
  const nearFamily = (p, fam, d, skip) => {
    for (const k of cells(p, p, d)) for (const [lj, sj] of grid.get(k) || []) {
      if (lj === skip || lines[lj].fam !== fam) continue;
      const P = lines[lj].pts, a = P[sj], b = P[sj + 1], abx = b.x - a.x, aby = b.y - a.y;
      const t = Math.max(0, Math.min(1, ((p.x - a.x) * abx + (p.y - a.y) * aby) / (abx * abx + aby * aby || 1)));
      if (hyp(p.x - a.x - abx * t, p.y - a.y - aby * t) < d) return true;
    }
    return false;
  };
  const trace = (start, startNode, fam, initDir, ignore) => {
    const li = lines.length, line = { pts: [start], fam, attach: [], startNode, endNode: -1 };
    lines.push(line);
    let p = start, prev = initDir, len = 0;
    for (let k = 0; k < state.maxLen * 1000 / h; k++) {
      let d = k === 0 ? initDir : align(unit(fieldAng(p) + fam * Math.PI / 2), prev);
      const mid = { x: p.x + d.x * h / 2, y: p.y + d.y * h / 2 };
      if (k > 0) d = align(unit(fieldAng(mid) + fam * Math.PI / 2), d);
      const np = { x: p.x + d.x * h, y: p.y + d.y * h };
      if (isWater(np, seed, R)) break;
      const hit = hitTest(p, np, li, len < 3 * h ? ignore : -2);
      if (hit) {
        nodes.push(hit.point);
        line.endNode = nodes.length - 1;
        lines[hit.lj].attach.push({ seg: hit.sj, t: hit.u, node: line.endNode });
        line.pts.push(hit.point); gridAdd(li, line.pts.length - 2);
        return li;
      }
      if (fam === 1 && len > 3 * h && nearFamily(np, 1, state.dsep * 0.5, li)) break;
      line.pts.push(np); gridAdd(li, line.pts.length - 2);
      p = np; prev = d; len += h;
    }
    nodes.push(p);
    line.endNode = nodes.length - 1;
    return li;
  };
  for (let i = 0; i < state.majors; i++) trace({ x: 0, y: 0 }, 0, 0, unit((i + rand() * 0.5) / state.majors * Math.PI * 2), -1);
  // Seed cross roads along the majors, then once more along those cross roads to fill the web.
  for (let gen = 0, from = 0; gen < 2; gen++) {
    const to = lines.length;
    for (let L = from; L < to; L++) {
      const P = lines[L].pts;
      let acc = 0, next = state.minorSpacing;
      for (let si = 0; si < P.length - 1; si++) {
        const sl = dist(P[si], P[si + 1]);
        while (acc + sl >= next) {
          const t = (next - acc) / sl, q = { x: P[si].x + (P[si + 1].x - P[si].x) * t, y: P[si].y + (P[si + 1].y - P[si].y) * t };
          next += state.minorSpacing;
          if (nearFamily(q, 1, state.dsep, -1)) continue;
          nodes.push(q);
          const ni = nodes.length - 1, tang = { x: (P[si + 1].x - P[si].x) / sl, y: (P[si + 1].y - P[si].y) / sl };
          lines[L].attach.push({ seg: si, t, node: ni });
          for (const s of [1, -1]) trace(q, ni, lines[L].fam ? 0 : 1, { x: -tang.y * s, y: tang.x * s }, L);
        }
        acc += sl;
      }
    }
    from = to;
  }
  // Split every line at its junctions into graph edges.
  const edges = [];
  const at = (P, seg, t) => ({ x: P[seg].x + (P[seg + 1].x - P[seg].x) * t, y: P[seg].y + (P[seg + 1].y - P[seg].y) * t });
  for (const ln of lines) {
    const P = ln.pts;
    if (P.length < 2) continue;
    const stops = [{ seg: 0, t: 0, node: ln.startNode }, ...ln.attach.sort((a, b) => a.seg - b.seg || a.t - b.t),
                   { seg: P.length - 2, t: 1, node: ln.endNode }];
    for (let i = 0; i < stops.length - 1; i++) {
      const A = stops[i], B = stops[i + 1];
      if (A.node === B.node) continue;
      const pts = [at(P, A.seg, A.t)];
      for (let s = A.seg + 1; s <= B.seg; s++) pts.push(P[s]);
      pts.push(at(P, B.seg, B.t));
      const e = [A.node, B.node, polyLen(pts)];
      e.pts = pts;
      if (e[2] > 1) edges.push(e);
    }
  }
  return { nodes, edges };
}

// --- draw --------------------------------------------------------------------------------
const cv = $("c"), ctx = cv.getContext("2d");
const RING_COLS = ["#5d8a4a", "#b59b5a", "#3f6f55", "#5b8a8f", "#c9d6dc", "#8a5b5b", "#7a6a9a", "#9a8a5a"];
let last = null, picked = -1;

const view = { zoom: 1, panX: 0, panY: 0 };

function draw() {
  const seed = +$("seed").value, R = state.radius, algo = $("algo").value;
  const rand = mulberry32(seed * 7919 + 1);
  const t0 = performance.now();
  const custom = { growth, growthPruned, ports, colonize, tensor }[algo];
  const net = custom ? custom(rand, seed, R) : graphAlgo(algo, rand, seed, R);
  last = { net, seed, R, ms: performance.now() - t0 };
  render();
  if (view3d) schedule3D();
}

// Value changes rebuild an open 3D view, but only once the sliders have been still for a moment.
let rebuild3dTimer = 0;
function schedule3D() {
  clearTimeout(rebuild3dTimer);
  rebuild3dTimer = setTimeout(() => { if (view3d) open3D().catch(() => {}); }, 400);
}

function render() {
  if (!last) return;
  const { net, seed, R, ms } = last;
  cv.width = innerWidth - 270; cv.height = innerHeight;
  const W = cv.width, H = cv.height;
  const sc = Math.min(W, H) / (R * 2.05) * view.zoom;
  const X = x => W / 2 + view.panX + x * sc, Y = y => H / 2 + view.panY + y * sc;
  last.X = X; last.Y = Y;

  const { nodes, edges } = net;
  const edgePts = e => e.pts || ($("wiggle").checked ? wiggle(nodes[e[0]], nodes[e[1]], seed) : [nodes[e[0]], nodes[e[1]]]);
  const roadPts = roundCorners(nodes, edges, edges.map(edgePts));
  last.roadPts = roadPts; last.sc = sc;

  // land, rings and water, sampled on a coarse screen grid
  const cell = 6;
  let terrainStats = "";
  if ($("terrain").checked) terrainStats = drawTerrain(roadPts, seed, R, W, H, sc, cell);
  else for (let py = 0; py < H; py += cell) for (let px = 0; px < W; px += cell) {
    const p = { x: (px - W / 2 - view.panX) / sc, y: (py - H / 2 - view.panY) / sc };
    if (!onLand(p, seed, R)) continue;
    if (isWater(p, seed, R)) ctx.fillStyle = "#1d4f6a";
    else ctx.fillStyle = $("rings").checked ? RING_COLS[ringOf(p, seed, R, state.ringCount)] : "#55704a";
    ctx.fillRect(px, py, cell, cell);
  }

  const deg = new Array(nodes.length).fill(0);
  for (const [a, b] of edges) { deg[a]++; deg[b]++; }

  // roads
  const sp = shortest(nodes.length, edges, nodes, 0);
  const onPath = new Set();
  if (picked >= 0 && sp.d[picked] < Infinity) for (let v = picked; sp.prev[v] >= 0; v = sp.prev[v]) onPath.add(v + "," + sp.prev[v]);
  const restStops = [];
  edges.forEach((e, ei) => {
    const [a, b] = e;
    const hot = onPath.has(a + "," + b) || onPath.has(b + "," + a);
    ctx.strokeStyle = hot ? "#ffdd55" : "#e8e0d0"; ctx.lineWidth = hot ? 3 : 1.6;
    ctx.beginPath();
    const pts = roadPts[ei];
    pts.forEach((p, i) => i ? ctx.lineTo(X(p.x), Y(p.y)) : ctx.moveTo(X(p.x), Y(p.y)));
    ctx.stroke();
    // Placeholder rest-stop rule: one wherever the road distance from spawn crosses a multiple
    // of the spacing.
    const dA = sp.d[a], dB = sp.d[b];
    if (dA === Infinity && dB === Infinity) return;
    const scale = e[2] / (polyLen(pts) || 1);
    let s = 0, prevK = -1;
    pts.forEach((p, i) => {
      if (i) s += dist(p, pts[i - 1]) * scale;
      const k = Math.floor(Math.min(dA + s, dB + e[2] - s) / state.restSpacing);
      if (i && k !== prevK && k > 0) restStops.push(p);
      prevK = k;
    });
  });
  ctx.fillStyle = "#ffb03a";
  for (const p of restStops) {
    const x = X(p.x), y = Y(p.y);
    ctx.beginPath(); ctx.moveTo(x, y - 5); ctx.lineTo(x + 5, y); ctx.lineTo(x, y + 5); ctx.lineTo(x - 5, y); ctx.fill();
  }

  // nodes: spawn, junction (3+), dead end (1)
  let deadEnds = 0, junctions = 0;
  nodes.forEach((p, i) => {
    const x = X(p.x), y = Y(p.y);
    if (i === 0) { ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill(); return; }
    if (deg[i] >= 3) { junctions++; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.stroke(); }
    else if (deg[i] === 1) { deadEnds++; ctx.fillStyle = "#e05555"; ctx.fillRect(x - 3, y - 3, 6, 6); }
    if (i === picked) { ctx.strokeStyle = "#ffdd55"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.stroke(); }
  });

  if ($("terrain").checked) { // the square the 3D view will show
    const half = state.area3d / 2 * sc;
    ctx.strokeStyle = "#fff"; ctx.setLineDash([6, 4]); ctx.lineWidth = 1;
    ctx.strokeRect(W / 2 - half, H / 2 - half, half * 2, half * 2);
    ctx.setLineDash([]);
  }

  drawScale(W, H, sc, roadPts);

  // stats
  const reach = sp.d.filter(d => d < Infinity);
  const len = edges.reduce((s, e) => s + e[2], 0);
  const ringsReached = new Set(nodes.filter((_, i) => sp.d[i] < Infinity).map(p => ringOf(p, seed, R, state.ringCount))).size;
  $("stats").textContent =
    `nodes        ${nodes.length}\nedges        ${edges.length}\n` +
    `loops        ${Math.max(0, edges.length - reach.length + 1)}\n` +
    `junctions    ${junctions}\ndead ends    ${deadEnds}\nrest stops   ${restStops.length}\n` +
    `unreachable  ${nodes.length - reach.length}\nrings reached ${ringsReached}/${state.ringCount}\n` +
    `road total   ${(len / 1000).toFixed(1)} km\nmean edge    ${(len / Math.max(1, edges.length)).toFixed(0)} m\n` +
    `furthest     ${(Math.max(...reach) / 1000).toFixed(1)} km by road\n` +
    (picked >= 0 ? `picked node  ${sp.d[picked] < Infinity ? (sp.d[picked] / 1000).toFixed(2) + " km by road" : "unreachable"}\n` : "") +
    `build        ${ms.toFixed(1)} ms` + terrainStats;
}

// --- road-first terrain ------------------------------------------------------------------
// Height comes from the roads instead of the roads being carved into noise:
//   base     the road's own gentle height, sampled at the nearest road point (so the road is
//            level across its width) and fading to the same field sampled locally far away;
//   mountain ridged noise that only rises with distance from the nearest road, so roads end up
//            in valleys and mountains fill the gaps between them;
//   ribbon   a bank or drop just beside the road, varying along the road and per side, which is
//            what makes cuttings and drop-offs.
// The only per-sample cost is one nearest-road lookup in a segment grid.
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function roadGrid(roadPts) {
  const G = 200, grid = new Map(), segs = [];
  roadPts.forEach((pts, ei) => {
    let cum = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1], len = dist(a, b);
      const s = segs.length;
      segs.push({ a, b, ei, cum, len });
      cum += len;
      for (let gx = Math.floor(Math.min(a.x, b.x) / G); gx <= Math.floor(Math.max(a.x, b.x) / G); gx++)
        for (let gy = Math.floor(Math.min(a.y, b.y) / G); gy <= Math.floor(Math.max(a.y, b.y) / G); gy++) {
          const k = gx * 100003 + gy;
          if (!grid.has(k)) grid.set(k, []);
          grid.get(k).push(s);
        }
    }
  });
  return { G, grid, segs };
}

function nearestRoad(rg, p, maxD) {
  const { G, grid, segs } = rg, gx = Math.floor(p.x / G), gy = Math.floor(p.y / G);
  let best = null;
  for (let r = 0; r <= Math.ceil(maxD / G); r++) {
    for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      for (const si of grid.get((gx + dx) * 100003 + gy + dy) || []) {
        const sg = segs[si], abx = sg.b.x - sg.a.x, aby = sg.b.y - sg.a.y;
        const t = Math.max(0, Math.min(1, ((p.x - sg.a.x) * abx + (p.y - sg.a.y) * aby) / (abx * abx + aby * aby || 1)));
        const qx = sg.a.x + abx * t, qy = sg.a.y + aby * t, d = hyp(p.x - qx, p.y - qy);
        // near-ties (where two roads share a junction point) go to the lower segment, so rounding never decides
        if (!best || d < best.d - 1e-9 || (Math.abs(d - best.d) <= 1e-9 && si < best.si))
          best = { si, d, q: { x: qx, y: qy }, s: sg.cum + sg.len * t, ei: sg.ei, side: Math.sign(abx * (p.y - sg.a.y) - aby * (p.x - sg.a.x)),
                   dir: { x: abx / (sg.len || 1), y: aby / (sg.len || 1) } };
      }
    }
    if (best && best.d < r * G) break;
  }
  return best && best.d <= maxD ? best : null;
}

// Small hills laid over everything, two octaves of Perlin noise.
function bumpAt(x, y, seed) {
  const sc = state.bumpSize;
  return (perlin(x / sc, y / sc, seed + 71) + perlin(x / sc * 2.03, y / sc * 2.03, seed + 73) * 0.5) * state.bumpHeight;
}

// The road's edge from its centreline: the game's road_half_width_m + road_shoulder_m.
const ROAD_EDGE_M = 2.9;

function heightAt(rg, p, seed) {
  const L = state.waterLevel, bp = baseH(p, seed);
  if (isLake(p, seed)) {
    const lake = L - state.lakeDepth * (L - bp); // meets the shore at exactly L
    // a lake never cuts into a road: near one, its bed rises into a bank up to the road's level
    const reach = ROAD_EDGE_M + state.lakeBank, near = nearestRoad(rg, p, reach);
    if (!near) return lake;
    const bq = bumpAt(near.q.x, near.q.y, seed), road = Math.max(baseH(near.q, seed), L + 3 - bq) + bq;
    return road + (lake - road) * smooth(ROAD_EDGE_M, reach, near.d);
  }
  // mountains flatten out toward a shore, so lakes get gentle banks rather than walls
  const shore = $("water").checked ? smooth(0, state.shoreBand, bp - L) : 1;
  const ridged = 1 - Math.abs(2 * fbm(p.x / 1200 + 11, p.y / 1200 + 11, seed + 43) - 1);
  const mtn = state.mountain * ridged * ridged * shore;
  const hit = nearestRoad(rg, p, state.mountainDist); // beyond this the mountain is at full height anyway
  if (!hit) return bp + mtn + bumpAt(p.x, p.y, seed) * shore;
  const far = smooth(state.flatW, state.mountainDist, hit.d);
  // the road takes the bumps at its own centre, so it rolls along its length but stays level across;
  // the ground under it is kept high enough that the road stays 3 m above the water
  const bq = bumpAt(hit.q.x, hit.q.y, seed);
  const hq = Math.max(baseH(hit.q, seed), L + 3 - bq), base = hq + (bp - hq) * far;
  const k = (fbm(hit.s / 400 + hit.ei * 13.7, hit.side * 5 + 100, seed + 57) - 0.5) * 2 * state.bank;
  const rib = k * smooth(state.flatW * 0.5, state.ribbonW * 0.5, hit.d) * (1 - smooth(state.ribbonW * 0.5, state.ribbonW, hit.d));
  const bump = bq + (bumpAt(p.x, p.y, seed) * shore - bq) * smooth(state.flatW * 0.5, state.flatW * 0.5 + 30, hit.d);
  return base + mtn * far + rib * shore + bump;
}

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }

function drawTerrain(roadPts, seed, R, W, H, sc, cell) {
  const t0 = performance.now(), rg = roadGrid(roadPts);
  const cols = Math.ceil(W / cell) + 1, rows = Math.ceil(H / cell) + 1;
  const hs = new Float32Array(cols * rows), land = new Uint8Array(cols * rows);
  let samples = 0;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const p = { x: (c * cell - W / 2 - view.panX) / sc, y: (r * cell - H / 2 - view.panY) / sc };
    if (!onLand(p, seed, R)) continue;
    land[r * cols + c] = isWater(p, seed, R) ? 2 : 1;
    hs[r * cols + c] = heightAt(rg, p, seed);
    samples++;
  }
  const ms = performance.now() - t0;
  const worldCell = cell / sc, hAt = (c, r) => hs[Math.min(rows - 1, Math.max(0, r)) * cols + Math.min(cols - 1, Math.max(0, c))];
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < hs.length; i++) if (land[i]) { lo = Math.min(lo, hs[i]); hi = Math.max(hi, hs[i]); }
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c;
    if (!land[i]) continue;
    if (land[i] === 2) { ctx.fillStyle = "#1d4f6a"; ctx.fillRect(c * cell, r * cell, cell, cell); continue; }
    const p = { x: (c * cell - W / 2 - view.panX) / sc, y: (r * cell - H / 2 - view.panY) / sc };
    const slope = ((hAt(c + 1, r) - hAt(c - 1, r)) + (hAt(c, r + 1) - hAt(c, r - 1))) / (2 * worldCell);
    let shade = Math.max(0.35, Math.min(1.3, 0.85 - slope * 1.2));
    const h = hs[i], band = Math.floor(h / state.contour);
    if (band !== Math.floor(hAt(c + 1, r) / state.contour) || band !== Math.floor(hAt(c, r + 1) / state.contour)) shade *= 0.7;
    const lift = (h - lo) / Math.max(1, hi - lo) * 60;
    const [rr, gg, bb] = hexRgb($("rings").checked ? RING_COLS[ringOf(p, seed, R, state.ringCount)] : "#55704a");
    ctx.fillStyle = `rgb(${rr * shade + lift},${gg * shade + lift},${bb * shade + lift})`;
    ctx.fillRect(c * cell, r * cell, cell, cell);
  }
  return `\nterrain      ${ms.toFixed(0)} ms / ${samples} samples\n` +
         `             ${(ms * 1000 / Math.max(1, samples)).toFixed(1)} µs per sample\n` +
         `height range ${lo.toFixed(0)}..${hi.toFixed(0)} m`;
}

// --- scale: a scale bar plus the game's car drawn to size on the road nearest the centre ----
const CAR = { length: 4.0, width: 1.8, height: 1.3 }; // about an MX-5

// The car sits on the road nearest the map centre, pointing along it.
function carPose(roadPts, cx, cy) {
  const hit = nearestRoad(roadGrid(roadPts), { x: cx, y: cy }, 20000);
  return hit ? { x: hit.q.x, y: hit.q.y, dir: hit.dir } : { x: cx, y: cy, dir: { x: 1, y: 0 } };
}

function drawScale(W, H, sc, roadPts) {
  // scale bar: the largest 1/2/5 × 10^k metres that fits in ~160 px
  let len = 1;
  for (const m of [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000]) if (m * sc <= 160) len = m;
  const x0 = 16, y0 = H - 20;
  ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(x0 - 6, y0 - 18, len * sc + 70, 28);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x0, y0 - 5); ctx.lineTo(x0, y0); ctx.lineTo(x0 + len * sc, y0); ctx.lineTo(x0 + len * sc, y0 - 5); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "12px ui-monospace, monospace";
  ctx.fillText(len >= 1000 ? `${len / 1000} km` : `${len} m`, x0 + len * sc + 8, y0);

  const car = carPose(roadPts, -view.panX / sc, -view.panY / sc);
  const X = W / 2 + view.panX + car.x * sc, Y = H / 2 + view.panY + car.y * sc;
  const l = CAR.length * sc, w = CAR.width * sc;
  ctx.save();
  ctx.translate(X, Y);
  ctx.rotate(Math.atan2(car.dir.y, car.dir.x));
  ctx.fillStyle = "#e0302a";
  ctx.fillRect(-l / 2, -w / 2, Math.max(l, 1), Math.max(w, 1));
  ctx.restore();
  if (l < 12) { // too small to see: ring it and say what it is
    ctx.strokeStyle = "#e0302a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(X, Y, 10, 0, 7); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.fillText(`car ${CAR.length} m`, X + 13, Y + 4);
  }
}

// --- 3D preview of the terrain square at the map centre (three.js, flat-shaded, low-res) ----
let view3d = null;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); });
}
async function open3D() {
  if (!last || !last.roadPts) return;
  if (!window.THREE) {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js");
    await loadScript("https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js");
  }
  const keep = view3d ? { pos: view3d.camera.position.clone(), target: view3d.controls.target.clone() } : null;
  close3D();
  const { seed, R } = last, size = state.area3d, N = Math.round(state.res3d), ex = state.exag;
  const cx = -view.panX / last.sc, cy = -view.panY / last.sc;
  const t0 = performance.now(), rg = roadGrid(last.roadPts);
  const geo = new THREE.PlaneGeometry(size, size, N, N);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, colors = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const p = { x: cx + pos.getX(i), y: cy + pos.getZ(i) };
    let h = state.waterLevel - 30, col = [0.35, 0.33, 0.25];
    if (onLand(p, seed, R)) {
      h = heightAt(rg, p, seed);
      const hit = nearestRoad(rg, p, 6);
      if (isLake(p, seed)) col = [0.4, 0.37, 0.28]; // lake bed, seen through the water
      else if (hit && hit.d < 4) col = [0.55, 0.5, 0.42];
      else col = hexRgb($("rings").checked ? RING_COLS[ringOf(p, seed, R, state.ringCount)] : "#55704a").map(v => v / 255);
    }
    pos.setY(i, h * ex);
    colors.set(col, i * 3);
  }
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const ms = performance.now() - t0;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fb8c8);
  scene.fog = new THREE.Fog(0x9fb8c8, size * 0.6, size * 1.8);
  scene.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true })));
  const waterGeo = new THREE.PlaneGeometry(size, size);
  waterGeo.rotateX(-Math.PI / 2);
  const water = new THREE.Mesh(waterGeo, new THREE.MeshLambertMaterial({ color: 0x2a6f95, transparent: true, opacity: 0.75 }));
  water.position.y = state.waterLevel * ex;
  scene.add(water);
  scene.add(new THREE.AmbientLight(0xffffff, 0.45));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(-1, 1.2, -0.6);
  scene.add(sun);

  // roads as lines just above the surface, clipped to the square
  const lineMat = new THREE.LineBasicMaterial({ color: 0xfff4d0 });
  for (const pts of last.roadPts) {
    let run = [];
    const flush = () => { if (run.length > 1) scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(run), lineMat)); run = []; };
    for (let k = 0; k < pts.length; k++) {
      const a = k ? pts[k - 1] : pts[0], b = pts[k], n = Math.max(1, Math.ceil(dist(a, b) / 10));
      for (let j = k ? 1 : 0; j <= n; j++) {
        const p = { x: a.x + (b.x - a.x) * j / n, y: a.y + (b.y - a.y) * j / n };
        if (Math.abs(p.x - cx) > size / 2 || Math.abs(p.y - cy) > size / 2) { flush(); continue; }
        run.push(new THREE.Vector3(p.x - cx, heightAt(rg, p, seed) * ex + 1.5, p.y - cy));
      }
    }
    flush();
  }

  // the car, to scale, on the road nearest the centre, with a tall pole so it can be found
  const car = carPose(last.roadPts, cx, cy);
  const carY = heightAt(rg, car, seed) * ex;
  const carMesh = new THREE.Mesh(new THREE.BoxGeometry(CAR.length, CAR.height, CAR.width),
    new THREE.MeshLambertMaterial({ color: 0xe0302a }));
  carMesh.position.set(car.x - cx, carY + CAR.height / 2, car.y - cy);
  carMesh.rotation.y = -Math.atan2(car.dir.y, car.dir.x);
  scene.add(carMesh);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 60, 6), new THREE.MeshBasicMaterial({ color: 0xff5040 }));
  pole.position.set(car.x - cx, carY + 30, car.y - cy);
  scene.add(pole);

  const box = $("view3d");
  box.style.display = "block";
  const renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setPixelRatio(0.5); // chunky pixels, closer to the game's PS1 look
  renderer.setSize(box.clientWidth, box.clientHeight);
  box.append(renderer.domElement);
  const camera = new THREE.PerspectiveCamera(55, box.clientWidth / box.clientHeight, 1, size * 10);
  camera.position.set(0, size * 0.35, size * 0.6);
  camera.near = 0.2; camera.updateProjectionMatrix();
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  $("info3d").textContent = `${size} m square, ${(N + 1) ** 2} vertices, built in ${ms.toFixed(0)} ms` +
    ` · red box = the car (${CAR.length} × ${CAR.width} m), press C to fly to it`;
  if (keep) { camera.position.copy(keep.pos); controls.target.copy(keep.target); }
  view3d = { renderer, controls, run: true, carAt: carMesh.position.clone(), camera };
  const loop = () => { if (!view3d || !view3d.run) return; controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); };
  loop();
}
function close3D() {
  if (!view3d) return;
  view3d.run = false;
  view3d.renderer.domElement.remove();
  view3d.renderer.dispose();
  view3d = null;
  $("view3d").style.display = "none";
}

// A cheap stand-in for layer 2: the edge as a seeded noise-displaced curve that stays inside
// a band around the straight line and lands exactly on both ends.
function wiggle(a, b, seed) {
  const step = Math.min(40, state.bendLen / 6);
  // the small epsilon keeps a length that divides exactly from flipping on last-digit rounding
  const d = dist(a, b), n = Math.max(2, Math.ceil(d / step - 1e-9)), nx = -(b.y - a.y) / d, ny = (b.x - a.x) / d;
  const s = Math.floor(hash2(Math.round(a.x + b.x), Math.round(a.y + b.y), seed) * 1e6);
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, env = Math.sin(t * Math.PI);
    // twistiness sets how far the road may swing from the straight line, bend length how often it turns
    const off = (fbm(t * d / state.bendLen, 0, s) - 0.5) * 2 * Math.min(d * state.roadTwist, 1200 * state.roadTwist) * env;
    out.push({ x: a.x + (b.x - a.x) * t + nx * off, y: a.y + (b.y - a.y) * t + ny * off });
  }
  return out;
}

// Same as RoadNetwork._round_corners: every bend sharper than the limit becomes two points a
// quarter of the way along its segments, repeated; where exactly two links meet the cut spans both.
function roundCorners(nodes, edges, roadPts) {
  const max = state.cornerTurn * Math.PI / 180, deg = new Array(nodes.length).fill(0), ends = new Map();
  const turn = (a, b, c) => { const ux = b.x - a.x, uy = b.y - a.y, vx = c.x - b.x, vy = c.y - b.y; return Math.abs(Math.atan2(ux * vy - uy * vx, ux * vx + uy * vy)); };
  const cut = (p, q) => ({ x: p.x + (q.x - p.x) * 0.25, y: p.y + (q.y - p.y) * 0.25 });
  for (const [a, b] of edges) { deg[a]++; deg[b]++; }
  edges.forEach(([a, b], ei) => [[a, true], [b, false]].forEach(([n, atStart]) => {
    if (n !== 0 && deg[n] === 2) ends.set(n, [...(ends.get(n) || []), [ei, atStart]]);
  }));
  let pts = roadPts.map(l => l.slice());
  for (let pass = 0; pass < 6; pass++) {
    let any = false;
    pts = pts.map(l => {
      const out = [l[0]];
      for (let i = 1; i < l.length - 1; i++) {
        if (turn(l[i - 1], l[i], l[i + 1]) > max) { out.push(cut(l[i], l[i - 1]), cut(l[i], l[i + 1])); any = true; }
        else out.push(l[i]);
      }
      out.push(l[l.length - 1]);
      return out;
    });
    for (const [[ea, sa], [eb, sb]] of ends.values()) {
      const A = pts[ea], B = pts[eb], p = sa ? A[0] : A[A.length - 1];
      const na = sa ? A[1] : A[A.length - 2], nb = sb ? B[1] : B[B.length - 2];
      if (turn(na, p, nb) <= max) continue;
      const ca = cut(p, na), cb = cut(p, nb), m = { x: (ca.x + cb.x) / 2, y: (ca.y + cb.y) / 2 };
      if (sa) A.splice(0, 1, m, ca); else A.splice(A.length - 1, 1, ca, m);
      if (sb) B.splice(0, 1, m, cb); else B.splice(B.length - 1, 1, cb, m);
      any = true;
    }
    if (!any) break;
  }
  return pts;
}

function pick(mx, my) {
  let best = -1, bd = 12;
  last.net.nodes.forEach((p, i) => { const d = hyp(last.X(p.x) - mx, last.Y(p.y) - my); if (d < bd) { bd = d; best = i; } });
  picked = best; render();
}

// Drag to pan, wheel to zoom around the cursor, double-click to reset; a click that barely
// moved still picks a node.
let drag = null;
cv.onmousedown = ev => { drag = { x: ev.clientX, y: ev.clientY, px: view.panX, py: view.panY, moved: false }; };
onmousemove = ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  if (drag.moved) { view.panX = drag.px + dx; view.panY = drag.py + dy; render(); }
};
onmouseup = ev => {
  if (drag && !drag.moved && ev.target === cv) {
    const r = cv.getBoundingClientRect();
    pick(ev.clientX - r.left, ev.clientY - r.top);
  }
  drag = null;
};
cv.onwheel = ev => {
  ev.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = ev.clientX - r.left - cv.width / 2, my = ev.clientY - r.top - cv.height / 2;
  const f = Math.exp(-ev.deltaY * 0.0015);
  const nz = Math.max(0.3, Math.min(60, view.zoom * f)), k = nz / view.zoom;
  view.panX = mx - (mx - view.panX) * k; view.panY = my - (my - view.panY) * k; view.zoom = nz;
  render();
};
cv.ondblclick = () => { view.zoom = 1; view.panX = view.panY = 0; render(); };
$("seed").oninput = () => { picked = -1; draw(); };
$("rnd").onclick = () => { $("seed").value = Math.floor(Math.random() * 99999); picked = -1; draw(); };
$("algo").onchange = () => { picked = -1; buildParams(); draw(); };
for (const id of ["wiggle", "rings", "water"]) $(id).onchange = draw;
$("terrain").onchange = () => { buildParams(); render(); if (view3d) schedule3D(); };
$("open3d").onclick = () => {
  if (!$("terrain").checked) { $("terrain").checked = true; buildParams(); render(); }
  open3D().catch(err => { $("stats").textContent += "\n3D failed: " + err; });
};
$("close3d").onclick = close3D;
// Every value currently on screen, as text to paste into a chat.
$("copy").onclick = async () => {
  const algo = $("algo").value;
  const shown = [...PARAMS.common, ...PARAMS[algo], ...($("terrain").checked ? PARAMS.terrain : [])];
  const lines = [`seed: ${$("seed").value}`, `algorithm: ${$("algo").selectedOptions[0].text}`];
  for (const [key, name] of shown) lines.push(`${name}: ${state[key]}`);
  for (const id of ["wiggle", "rings", "water", "terrain"]) lines.push(`${id}: ${$(id).checked ? "on" : "off"}`);
  const text = lines.join("\n");
  try { await navigator.clipboard.writeText(text); }
  catch { // file:// pages may not get the async clipboard; fall back to a selected textarea
    const ta = document.createElement("textarea");
    ta.value = text; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  $("copied").textContent = "copied";
  setTimeout(() => { $("copied").textContent = ""; }, 1500);
};
addEventListener("keydown", ev => {
  if (!view3d || ev.key.toLowerCase() !== "c") return;
  const t = view3d.carAt;
  view3d.controls.target.copy(t);
  view3d.camera.position.set(t.x - 14, t.y + 6, t.z + 10);
});
onresize = render;
buildParams(); draw();
</script>
</body>
</html>
