<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Start Line Lab</title>
<style>
  body { margin: 0; display: flex; font: 13px system-ui, sans-serif; background: #15171a; color: #ddd; height: 100vh; }
  #side { width: 280px; padding: 12px; overflow-y: auto; background: #1d2024; box-sizing: border-box; flex-shrink: 0; }
  #side label { display: block; margin: 9px 0 2px; }
  #side select, #side input[type=number], #side input[type=text], #side input[type=range] { width: 100%; box-sizing: border-box; }
  #side .row { display: flex; gap: 6px; }
  #side button { margin-top: 6px; display: block; width: 100%; }
  #stats { margin-top: 14px; white-space: pre; font-family: ui-monospace, monospace; font-size: 12px; color: #aab; }
  #wrap { flex: 1; position: relative; }
  #wrap canvas { display: block; width: 100%; height: 100%; }
  .hint { color: #889; font-size: 11px; margin-top: 10px; }
</style>
</head>
<body>
<div id="side">
  <label>Seed</label>
  <div class="row"><input id="seed" type="number" value="1"><button id="rnd" style="width:auto;margin:0">🎲</button></div>
  <label>Event banner</label>
  <input id="event" type="text" value="" placeholder="(seeded)">
  <label>Road width <span id="widthV"></span> m</label>
  <input id="width" type="range" min="3" max="12" step="0.25" value="5">
  <label>Zone length <span id="lenV"></span> m</label>
  <input id="len" type="range" min="30" max="140" step="5" value="70">
  <label>Arch</label>
  <select id="arch"><option value="">Auto (by seed)</option><option value="truss">Aluminium truss</option><option value="inflatable">Inflatable</option><option value="none">None</option></select>
  <div id="stats"></div>
  <div id="ads"></div>
  <div class="hint">Drag to orbit, scroll to zoom, right-drag to pan. The road runs along z with the start line at the origin; cars drive towards −z. The road and grass are not baked, only the dressing around them. The game bakes seeds from StartLines.SEEDS (tools/bake_buildings.js).</div>
</div>
<div id="wrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="start_lines.js"></script>
<script>
// Preview page that generates a rally stage start (arch, start control, gazebos, tape, sponsor adverts) around a road of a given width.
const $ = id => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.outputEncoding = THREE.sRGBEncoding;
$("wrap").appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#a9c3d6");
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight("#cfe0ef", "#4a5a30", 0.75));
const sun = new THREE.DirectionalLight("#fff4e0", 0.9); sun.position.set(8, 14, 10); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ color: "#5a7a38" }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; scene.add(ground);

const box = (g, w, h, d, x, y, z, c) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: c })); m.position.set(x, y, z); g.add(m); return m; };

let group_ = new THREE.Group(), road = new THREE.Group(); scene.add(group_, road);
function buildRoad(W, L) {
  scene.remove(road); road = new THREE.Group(); scene.add(road);
  box(road, W, 0.04, L + 60, 0, 0, 0, "#8a8274");
  box(road, W, 0.045, 0.3, 0, 0.002, 0, "#f2f2ee");
}
function frame() {
  const L = +$("len").value, W = +$("width").value, r = Math.max(L * 0.55, W * 2 + 20);
  controls.target.set(0, 1.5, 0); camera.position.set(r * 0.7, r * 0.45, r * 0.75); controls.update();
}
function regen(fit) {
  scene.remove(group_); group_.traverse(o => o.geometry?.dispose());
  const seed = +$("seed").value;
  $("widthV").textContent = $("width").value; $("lenV").textContent = $("len").value;
  buildRoad(+$("width").value, +$("len").value);
  const res = StartLines.build(seed, { width: +$("width").value, len: +$("len").value, arch: $("arch").value, event: $("event").value });
  group_ = res.root; scene.add(group_);
  if (fit) frame();
  let tris = 0, meshes = 0; group_.traverse(o => { if (o.isMesh) { meshes++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
  const i = res.info;
  $("stats").textContent = `banner      ${i.event}\narch        ${i.arch}\ncontrol     ${i.side} side\ngazebos     ${i.gazebos}\nfootprint   ${(2 * i.outer).toFixed(1)} m wide (road ${$("width").value}, ${(i.outer - $("width").value / 2).toFixed(1)} m each side)\nmeshes      ${meshes}\ntriangles   ${tris}\nsponsors`;
  $("ads").replaceChildren(...i.ads.map(a => { const c = document.createElement("canvas"); c.width = 352; c.height = 128; c.style.cssText = "width:100%;margin-top:6px"; a.draw(c.getContext("2d"), 352, 128); return c; }));
}
for (const id of ["seed", "width", "len"]) $(id).addEventListener("input", () => regen(true));
for (const id of ["event", "arch"]) $(id).addEventListener("input", () => regen(false));
$("rnd").onclick = () => { $("seed").value = Math.floor(Math.random() * 1e6); regen(true); };
function resize() { const w = $("wrap").clientWidth, h = $("wrap").clientHeight; renderer.setSize(w, h, false); renderer.setPixelRatio(devicePixelRatio); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
const q = new URLSearchParams(location.search);
for (const k of ["seed", "width", "len", "event", "arch"]) if (q.get(k)) $(k).value = q.get(k);
regen(true);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
