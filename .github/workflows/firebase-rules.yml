name: Firestore rules

# Deploys firestore.rules to the `tapparally` Firebase project so the committed
# rules — not whatever someone last pasted into the console — are the single
# source of truth for who can read a player's cloud save.
#
# Deliberately SEPARATE from the Release workflow. Rules change roughly never,
# take seconds to deploy, and have nothing to do with exporting game builds:
# coupling them would mean a rules typo blocks a game release, or a broken
# Android export blocks a security fix. The paths filter means this workflow is
# normally dormant.
#
# Required repository secret (Settings -> Secrets and variables -> Actions):
#   FIREBASE_SERVICE_ACCOUNT - full contents of a GCP service-account JSON key
#                              for the tapparally project, with the "Firebase
#                              Rules Admin" role (roles/firebaserules.admin).
#                              This is a DIFFERENT key from
#                              PLAY_SERVICE_ACCOUNT_JSON (different project,
#                              different permissions) — do not reuse that one.
#
# See features/cloud-save.md for what the rules actually enforce.

on:
  push:
    branches: [main]
    # Only when the rules (or the config that points at them) actually change.
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-rules.yml"
  # Manual runs, for the first deploy and for re-applying rules after someone
  # has edited them in the console.
  workflow_dispatch: {}

# Never let two rules deploys race: the last writer would win non-deterministically.
concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  deploy-rules:
    name: Deploy firestore.rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install firebase-tools
        run: npm install -g firebase-tools@13

      - name: Write service-account credentials
        env:
          # Via env, not inline in the script: a secret interpolated straight
          # into a shell command can be mangled by quoting and is easier to
          # leak into a trace.
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ -z "${SERVICE_ACCOUNT}" ]]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set — see this workflow's header."
            exit 1
          fi
          printf '%s' "${SERVICE_ACCOUNT}" > "${RUNNER_TEMP}/firebase-key.json"
          chmod 600 "${RUNNER_TEMP}/firebase-key.json"

      - name: Deploy rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          set -euo pipefail
          firebase deploy --only firestore:rules --project tapparally --non-interactive

      - name: Remove credentials
        # Runs even if the deploy failed, so a key never outlives the step that
        # needed it (the runner is ephemeral, but this costs nothing).
        if: always()
        run: rm -f "${RUNNER_TEMP}/firebase-key.json"
