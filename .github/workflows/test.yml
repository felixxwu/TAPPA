name: Tests

# PR gate for the headless GUT suite. The Release workflow (deploy.yml) has no
# test job and only triggers on push to main — by the time it runs, a red test
# is too late to stop anything. This workflow is the missing pre-merge half:
# it runs the SAME runner a developer would (`./run_tests.sh`, GUT vendored in
# addons/gut/) on every PR that targets main, and never deploys anything, so
# a manual dispatch from the Actions tab is always safe.
#
# Kept in its own file rather than added to deploy.yml's `on:` because a
# pull_request trigger there would run the whole release pipeline on PRs —
# exports and store uploads are not something a docs PR should be able to do.

on:
  pull_request:
    branches: [main]
  # Direct pushes to main that touch goldens/ still get the bless guard and the golden checks.
  push:
    branches: [main]
    paths: ["goldens/**", "crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "third_party/**", "web/viewer/**", "tools/build_viewer_web.sh", "tools/web_check.mjs", "tools/wasi_sdk.sh", "tools/dep_guard.sh", "tools/neutral_*", "scripts/level_bake.gd", "scripts/neutral_file.gd"]
  workflow_dispatch:
    inputs:
      bless:
        description: "Re-bless goldens on this Linux image and upload them as an artifact (nothing is committed)"
        type: choice
        default: none
        options: [none, all, car-step, events, scene-counts, menus, touch]

# Read-only is all a test run needs.
permissions:
  contents: read

# A new push to the same PR cancels the previous run — the suite takes ~9 min
# on a CI-class container, so stale runs pile up fast without this.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the same version as deploy.yml and the local editor — the test
  # runner's --fixed-fps 60 / physics assumptions don't vary by patch, but the
  # class-cache warmup output does, and CI should match what developers see.
  GODOT_VERSION: "4.6.3"

jobs:
  headless:
    name: GUT headless suite
    runs-on: ubuntu-latest
    # Worst case legit run: install (~1 min) + runner's own caps (WARMUP 300s
    # + TEST 1800s) + shutdown. 40 min kills a wedged runner the runner's own
    # TEST_STALL/timeout net somehow missed.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      # Fresh checkouts have no imported assets, and the level tests need the baked level files.
      - name: Import project and fetch level bakes
        env:
          GODOT: /usr/local/bin/godot
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf "\n[editor]\nimport/use_multiple_threads=false\n" >> project.godot
          timeout 600 godot --headless --import --quit || true
          tools/fetch_bakes.sh

      # run_tests.sh is self-contained: it honours $GODOT, does its own
      # class-cache warmup with a timeout cap, sandboxes the player profile via
      # GUT run hooks, and applies TEST_TIMEOUT/TEST_STALL hang nets. No import
      # step here — the runner's warmup already covers it.
      - name: Run the headless suite
        run: ./run_tests.sh
        env:
          GODOT: /usr/local/bin/godot

  emulator:
    name: Cloud save against the Firebase emulators
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      # Fresh checkouts have no imported assets, and the level tests need the baked level files.
      - name: Import project and fetch level bakes
        env:
          GODOT: /usr/local/bin/godot
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf "\n[editor]\nimport/use_multiple_threads=false\n" >> project.godot
          timeout 600 godot --headless --import --quit || true
          tools/fetch_bakes.sh

      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      # emulators:exec starts Auth and Firestore with firestore.rules (firebase.json), sets
      # FIREBASE_AUTH_EMULATOR_HOST / FIRESTORE_EMULATOR_HOST for the runner, and stops them after.
      - name: Run the emulator suite
        run: firebase emulators:exec --only auth,firestore --project tapparally "./run_tests.sh --emulator"
        env:
          GODOT: /usr/local/bin/godot

  replay-determinism:
    name: Golden replay determinism
    runs-on: ubuntu-latest
    # Two full headless replays of the Hafren drive, the second with every core busy.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      # Fresh checkouts have no imported assets, and the replay drives the baked Hafren level.
      - name: Import project and fetch level bakes
        env:
          GODOT: /usr/local/bin/godot
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf "\n[editor]\nimport/use_multiple_threads=false\n" >> project.godot
          timeout 600 godot --headless --import --quit || true
          tools/fetch_bakes.sh

      # The recording (benchmark/runs/hafren.rec) is checked into git, so nothing else to fetch.
      - name: Replay twice and compare the per-tick traces
        run: ./run_level_replay.sh --golden-check --full
        env:
          GODOT: /usr/local/bin/godot

  # Goldens (goldens/README.md): a fresh run of each mode must match its blessed file byte for byte.
  # A golden that hasn't been blessed yet is skipped with a notice. A manual run with "bless" set
  # writes the goldens here instead and uploads them for review, since goldens are blessed on this image.
  goldens:
    name: Goldens
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Import project and fetch level bakes
        env:
          GODOT: /usr/local/bin/godot
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf "\n[editor]\nimport/use_multiple_threads=false\n" >> project.godot
          timeout 600 godot --headless --import --quit || true
          tools/fetch_bakes.sh

      - name: Bless goldens
        if: github.event_name == 'workflow_dispatch' && inputs.bless != 'none'
        env:
          GODOT: /usr/local/bin/godot
          WHICH: ${{ inputs.bless }}
        run: |
          set -euo pipefail
          if [[ $WHICH == all ]]; then set -- car-step events scene-counts menus touch; else set -- "$WHICH"; fi
          for name in "$@"; do ./bless.sh "$name"; done

      - name: Upload blessed goldens for review
        if: github.event_name == 'workflow_dispatch' && inputs.bless != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: goldens/*.jsonl.gz

      - name: Check goldens
        if: github.event_name != 'workflow_dispatch' || inputs.bless == 'none'
        env:
          GODOT: /usr/local/bin/godot
        run: |
          set -uo pipefail
          mkdir -p golden-logs
          FAILED=()
          check() {  # check <name> <golden file> <command...>
            local name=$1 file=$2; shift 2
            if [[ ! -f $file ]]; then
              echo "::notice::$file isn't blessed yet, skipping (run this workflow by hand with bless=$name)"
              return
            fi
            echo "::group::$name"
            "$@" 2>&1 | tee "golden-logs/$name.log" || FAILED+=("$name")
            echo "::endgroup::"
          }
          check car-step goldens/car_step.jsonl.gz ./run_level_replay.sh --car-golden --check
          check events goldens/events.jsonl.gz ./run_level_replay.sh --events-golden --check
          # The scene modes need the physics thread off, which only an override.cfg can do (as in bless.sh).
          printf '[physics]\n3d/run_on_separate_thread=false\n' > override.cfg
          scene() { "$GODOT" --headless --fixed-fps 60 "res://$1" -- --golden --seed=90210 --check; }
          check scene-counts goldens/scene_counts.jsonl.gz scene benchmark/scene_counts.tscn
          check menus goldens/menus.jsonl.gz scene benchmark/menu_flow.tscn
          check touch goldens/touch.jsonl.gz scene benchmark/touch_flow.tscn
          rm -f override.cfg
          if (( ${#FAILED[@]} )); then echo "::error::goldens differ: ${FAILED[*]}"; exit 1; fi

      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: golden-logs/
          if-no-files-found: ignore

  # Phase 2 parity (features/neutral-format.md): Godot exports the neutral files, Rust reads them, manifests must match.
  # Until a neutral bake is published, the job exports its own from the fetched .bake.res.
  neutral:
    name: Neutral format
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Import project and fetch level bakes
        env:
          GODOT: /usr/local/bin/godot
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf "\n[editor]\nimport/use_multiple_threads=false\n" >> project.godot
          timeout 600 godot --headless --import --quit || true
          tools/fetch_bakes.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Fetch the published neutral bake
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if tools/fetch_neutral_bake.sh; then
            mkdir -p build/published && cp tools/levels/*.bake.bin build/published/
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no neutral bake published yet, checking the one this job exports (run tools/publish_bake.sh to publish)"
          fi

      - name: Export, build and compare
        env:
          GODOT: /usr/local/bin/godot
        run: tools/neutral_check.sh

      - name: The published bake is the one this export writes
        if: steps.published.outputs.found == 'true'
        run: |
          for f in build/published/*.bake.bin; do cmp "$f" "tools/levels/$(basename "$f")"; done

      - name: Upload manifests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neutral-manifests
          path: build/neutral/*.manifest
          if-no-files-found: ignore

      - name: Upload Cargo.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock
          if-no-files-found: ignore

  # A commit that changes goldens/ must say why on a "Bless:" line in its message.
  bless-guard:
    name: Bless guard
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Every commit touching goldens/ has a Bless line
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A new branch's first push has no "before"; then check just the pushed commit.
          if [[ $BASE =~ ^0+$ ]] || ! git cat-file -e "$BASE" 2>/dev/null; then RANGE="$HEAD^!"; else RANGE="$BASE..$HEAD"; fi
          BAD=0
          for c in $(git rev-list "$RANGE" -- goldens/); do
            if ! git log -1 --format=%B "$c" | grep -q '^Bless:'; then
              echo "::error::$(git log -1 --format='%h %s' "$c") changes goldens/ without a Bless: line"
              BAD=1
            fi
          done
          exit $BAD

  # Phase 3 spike (todo/2026-11-28-phase-3-plan.md, R1-R7). Cargo.lock is not committed-clean yet, so no --locked;
  # each job uploads the Cargo.lock it resolved.
  rust-native:
    name: Rust native (R1, R1b, R6 lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Dependency guard
        run: tools/dep_guard.sh
      - name: Workspace tests (GPU probe on lavapipe)
        env:
          TAPPA_GPU: "1"
          TAPPA_GPU_ADAPTER: llvmpipe
          WGPU_BACKEND: vulkan
        run: cargo test --workspace -- --nocapture
      - name: R1b determinism option difference
        run: |
          set -euo pipefail
          cargo test -p physics --test r1b --no-default-features -- --nocapture
          cargo test -p physics --test r1b -- --nocapture | tee r1b.log
          { echo "### R1b"; grep R1B r1b.log || echo "no R1B line"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Cargo.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock-rust-native
          path: Cargo.lock

  rust-web:
    name: Rust web (R2, R3, R4, R5)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Read the nightly pin from build_viewer_web.sh
        run: |
          N=$(grep -oE 'nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}' tools/build_viewer_web.sh | head -1)
          echo "NIGHTLY=$N" >> "$GITHUB_ENV"
          echo "WGBG=$(grep -E '^wasm-bindgen = ' crates/app/Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_ENV"
      - name: Install nightly with rust-src and the wasm target
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src --target wasm32-unknown-unknown
          rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.NIGHTLY }}
      - name: Install wasm-bindgen-cli (same version as the crate) and wasm-tools
        run: cargo install wasm-bindgen-cli@"$WGBG" wasm-tools --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.52.0
          playwright install --with-deps chromium
      - name: wasi-sdk
        run: tools/wasi_sdk.sh
      - name: Build the viewer (R2 link, R5 compile)
        run: tools/build_viewer_web.sh
      - name: R2 memory is shared and no stray wasi imports
        run: |
          set -euo pipefail
          wasm-tools print build/viewer/viewer_bg.wasm > build/viewer/viewer.wat
          grep -E '\(import "[^"]+" "memory" \(memory [^)]*shared' build/viewer/viewer.wat
          if grep -E 'import "wasi_snapshot_preview1"' build/viewer/viewer.wat; then echo "stray wasi imports"; exit 1; fi
          grep -oE '\(import "[^"]+"' build/viewer/viewer.wat | sort | uniq -c | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Native reference trace for R3
        run: |
          mkdir -p build
          cargo run -p app --bin viewer --release -- --check=jolt > build/native-jolt.json
      - name: R3 jolt on wasm equals native
        run: node tools/web_check.mjs jolt --expect=build/native-jolt.json
      - name: R4 jolt_worker
        if: always()
        run: node tools/web_check.mjs jolt_worker --expect=build/native-jolt.json
      - name: R5 gpu probe on SwiftShader
        if: always()
        run: node tools/web_check.mjs gpu
      - name: Upload the viewer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer
          path: build/viewer
          if-no-files-found: ignore
      - name: Upload Cargo.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock-rust-web
          path: Cargo.lock

  rust-windows:
    name: Rust Windows (R6 WARP)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Render probe on WARP
        env:
          TAPPA_GPU: "1"
          TAPPA_GPU_FALLBACK: "1"
          WGPU_BACKEND: dx12
        run: cargo test -p render -- --nocapture
      - name: Upload Cargo.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock-rust-windows
          path: Cargo.lock

  rust-apple:
    name: Rust Apple (R7)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build for iOS
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        run: |
          cargo build -p app --lib --target aarch64-apple-ios
          cargo build -p app --lib --target aarch64-apple-ios-sim
      - name: Probe on macOS (Metal; skipped when the runner has no adapter)
        env:
          TAPPA_GPU: "1"
        run: |
          if cargo test -p render --test probe -- --nocapture 2>&1 | tee probe.log; then exit 0; fi
          if grep -q "no adapter" probe.log; then echo "::notice::no Metal adapter on this runner, probe skipped"; else exit 1; fi
      - name: Upload Cargo.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock-rust-apple
          path: Cargo.lock

  rust-android:
    name: Rust Android (R7)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-ndk@3.5.4
      - name: Build for arm64-v8a with the runner's NDK
        run: cargo ndk -t arm64-v8a build -p app --lib
      - name: Upload Cargo.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock-rust-android
          path: Cargo.lock
